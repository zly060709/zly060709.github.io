<script>
/* assets/engine.js */
/* 能量账本 · 计算引擎
   纯函数，不依赖 DOM 与存储，便于单独验证。
   核心：自适应 TDEE（用你自己的体重与摄入反推真实消耗）、区间估算、下一餐决策。
*/
(function (global) {
  'use strict';

  const DATA = global.LEDGER_DATA;
  const KCAL_PER_KG = 7700;
  const WINDOW = 28;

  /* ---------------- 日期 ---------------- */
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateOf(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function todayKey() { return keyOf(new Date()); }
  function addDays(key, delta) {
    const p = key.split('-').map(Number);
    return keyOf(new Date(p[0], p[1] - 1, p[2] + delta));
  }
  function rangeKeys(endKey, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(addDays(endKey, -i));
    return out;
  }
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function weekday(key) { return WEEK[dateOf(key).getDay()]; }
  function isWeekend(key) { const w = dateOf(key).getDay(); return w === 0 || w === 6; }
  function dateLabel(key) {
    const p = key.split('-').map(Number);
    return p[1] + '月' + p[2] + '日';
  }
  function fullLabel(key) { return dateLabel(key) + ' · 周' + weekday(key); }
  function shortLabel(key) { const p = key.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function daysBetween(a, b) { return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
  function relativeDay(key, today) {
    if (key === today) return '今天';
    if (key === addDays(today, -1)) return '昨天';
    if (key === addDays(today, 1)) return '明天';
    return dateLabel(key);
  }

  /* ---------------- 食物库 ---------------- */
  const CATS = DATA.categories;
  const FOODS = DATA.foods.map((r, i) => ({
    id: 'f' + i,
    name: r[0],
    cat: r[1],
    catName: CATS[r[1]],
    kcal: r[2],
    p: r[3],
    c: r[4],
    f: r[5],
    fib: r[6],
    unitG: r[7] || 0,
    unit: r[8] || '',
    aliases: r[9] ? r[9].split('|') : [],
    custom: false
  }));

  const EXERCISES = DATA.exercises.map((r, i) => ({ id: 'e' + i, name: r[0], mets: r[1] }));
  const MEALS = DATA.meals;
  const ACTIVITIES = DATA.activities;

  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
  function searchFoods(keyword, foods) {
    const pool = foods || FOODS;
    const q = norm(keyword);
    if (!q) return pool.slice(0, 40);
    const scored = [];
    pool.forEach(f => {
      let score = 0;
      const n = norm(f.name);
      if (n === q) score = 100;
      else if (n.indexOf(q) === 0) score = 80;
      else if (n.indexOf(q) > -1) score = 55;
      else if (f.aliases.some(a => norm(a).indexOf(q) > -1)) score = 45;
      else if (norm(f.catName).indexOf(q) > -1) score = 20;
      if (score) scored.push({ f, score });
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 40).map(x => x.f);
  }
  function foodByName(name, foods) {
    const q = norm(name);
    const pool = foods || FOODS;
    return pool.find(f => norm(f.name) === q) ||
      pool.find(f => f.aliases.some(a => norm(a) === q)) ||
      pool.find(f => norm(f.name).replace(/（.*?）/g, '') === q) || null;
  }
  function mealLabel(key) { const m = MEALS.find(x => x[0] === key); return m ? m[1] : '一餐'; }
  function guessMeal(now) {
    const h = (now || new Date()).getHours();
    if (h < 10) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  /* ---------------- 目标 ---------------- */
  function targets(p, weightKg) {
    if (!p || !p.sex || !p.age || !p.height) return null;
    const w = Number(weightKg || p.weight || 65);
    const height = Number(p.height), age = Number(p.age);
    const base = 10 * w + 6.25 * height - 5 * age;
    const bmr = Math.round(p.sex === 'male' ? base + 5 : base - 161);
    const activity = ACTIVITIES.find(a => a[0] === p.activity) || ACTIVITIES[1];
    const priorTDEE = Math.round(bmr * activity[3]);
    const rate = Number(p.rate || 0.5);
    const goal = p.goal || 'lose';
    let deficit;
    if (goal === 'lose') deficit = Math.min(rate * KCAL_PER_KG / 7, priorTDEE * 0.22);
    else if (goal === 'gain') deficit = -Math.min(rate * KCAL_PER_KG / 7, priorTDEE * 0.15);
    else deficit = 0;
    deficit = Math.round(deficit);
    const floor = p.sex === 'male'
      ? Math.max(1500, Math.round(bmr * 0.92))
      : Math.max(1200, Math.round(bmr * 0.92));
    let budget = priorTDEE - deficit;
    if (budget < floor) { budget = floor; deficit = priorTDEE - budget; }
    const proteinPerKg = Number(p.proteinFactor) || (goal === 'lose' ? 1.6 : goal === 'gain' ? 1.8 : 1.4);
    return {
      bmr,
      priorTDEE,
      activity: activity[1],
      activityFactor: activity[3],
      deficit,
      floor,
      budgetPrior: Math.round(budget / 10) * 10,
      protein: Math.round(w * proteinPerKg),
      proteinPerKg,
      fiber: p.sex === 'male' ? 30 : 25,
      water: Math.round(w * 35 / 50) * 50,
      rate,
      goal,
      weight: w,
      capped: goal === 'lose' && rate * KCAL_PER_KG / 7 > priorTDEE * 0.22
    };
  }

  function budgetFor(tdee, tgt) {
    if (!tgt) return tdee;
    return Math.max(tgt.floor, Math.round((tdee - tgt.deficit) / 10) * 10);
  }

  /* ---------------- 线性回归 ---------------- */
  function regress(points) {
    const n = points.length;
    if (n < 2) return null;
    let mx = 0, my = 0;
    points.forEach(p => { mx += p.x; my += p.y; });
    mx /= n; my /= n;
    let sxx = 0, sxy = 0, syy = 0;
    points.forEach(p => {
      const dx = p.x - mx, dy = p.y - my;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    });
    if (!sxx) return null;
    const slope = sxy / sxx;
    const intercept = my - slope * mx;
    const ssr = Math.max(0, syy - slope * sxy);
    const se = n > 2 ? Math.sqrt((ssr / (n - 2)) / sxx) : 0;
    return { slope, intercept, n, se, mx, my };
  }

  /* ---------------- 体重趋势（EMA） ---------------- */
  function weightMap(weights) {
    const map = {};
    (weights || []).forEach(w => {
      const kg = Number(w.kg != null ? w.kg : w.weight);
      if (!isFinite(kg) || kg <= 0) return;
      const k = w.date || w.dateKey;
      map[k] = kg;
    });
    return map;
  }

  function trendSeries(weights, startKey, endKey) {
    const map = weightMap(weights);
    const keys = Object.keys(map).sort();
    if (!keys.length) return [];
    const out = [];
    let tw = null;
    const begin = addDays(startKey, -14);
    for (let k = begin; k <= endKey; k = addDays(k, 1)) {
      if (map[k] != null) {
        tw = tw == null ? map[k] : tw + 0.22 * (map[k] - tw);
        out.push({ date: k, tw: tw, raw: map[k] });
      } else if (tw != null && k >= startKey) {
        out.push({ date: k, tw: tw, raw: null });
      }
    }
    return out;
  }

  function latestWeight(weights, profile) {
    const map = weightMap(weights);
    const keys = Object.keys(map).sort();
    if (keys.length) {
      const k = keys[keys.length - 1];
      return { kg: map[k], date: k };
    }
    return profile && profile.weight ? { kg: Number(profile.weight), date: null } : null;
  }

  /* ---------------- 自适应 TDEE ---------------- */
  function adaptive(entries, weights, profile, tgt, today) {
    const todayK = today || todayKey();
    const end = addDays(todayK, -1);
    const start = addDays(end, -(WINDOW - 1));
    const intakeMap = {};
    (entries || []).forEach(e => {
      const k = e.date || e.dateKey;
      if (k < start || k > end) return;
      intakeMap[k] = (intakeMap[k] || 0) + Math.max(0, Number(e.kcal) || 0);
    });
    const keys = rangeKeys(end, WINDOW);
    const validDays = keys.filter(k => intakeMap[k] >= 500);
    const meanIntake = validDays.length
      ? validDays.reduce((s, k) => s + intakeMap[k], 0) / validDays.length : 0;

    const wmap = weightMap(weights);
    const wpoints = Object.keys(wmap).filter(k => k >= addDays(start, -7) && k <= end)
      .sort().map(k => ({ x: daysBetween(start, k), y: wmap[k], key: k }));
    const reg = wpoints.length >= 4 ? regress(wpoints) : null;
    const span = wpoints.length ? daysBetween(wpoints[0].key, wpoints[wpoints.length - 1].key) : 0;

    let observed = null, w = 0, band = Math.round(tgt.priorTDEE * 0.12), status = 'prior';
    const enough = validDays.length >= 8 && wpoints.length >= 5 && span >= 12 && reg;
    if (enough) {
      observed = meanIntake - reg.slope * KCAL_PER_KG;
      const evidence = Math.min(validDays.length, Math.max(wpoints.length * 1.5, 8));
      w = Math.min(0.92, Math.max(0, evidence / 26));
      if (observed < tgt.priorTDEE * 0.72 || observed > tgt.priorTDEE * 1.4) {
        w = Math.min(w, 0.3);
      }
      observed = Math.max(tgt.priorTDEE * 0.72, Math.min(tgt.priorTDEE * 1.4, observed));
      band = Math.max(80, Math.min(900, Math.round(reg.se * 1.64 * KCAL_PER_KG)));
      status = w >= 0.55 ? 'calibrated' : 'calibrating';
    }
    const tdee = enough ? Math.round(observed * w + tgt.priorTDEE * (1 - w)) : tgt.priorTDEE;
    const evidenceDays = Math.min(validDays.length, Math.max(wpoints.length * 2, 0));
    const daysNeeded = Math.max(0, Math.min(18, 22 - evidenceDays));

    // 预测用斜率：最近 28 天全部体重点
    const recent = Object.keys(wmap).filter(k => k >= addDays(end, -27) && k <= end)
      .sort().map(k => ({ x: daysBetween(start, k), y: wmap[k], key: k }));
    const regRecent = recent.length >= 4 ? regress(recent) : reg;
    const latest = latestWeight(weights, profile);
    const series = trendSeries(weights, start, end);
    const trendNow = series.length ? series[series.length - 1].tw : (latest ? latest.kg : null);

    return {
      prior: tgt.priorTDEE,
      observed: observed == null ? null : Math.round(observed),
      tdee,
      band,
      weight: w,
      percent: Math.round(w * 100),
      status,
      validDays: validDays.length,
      weightDays: wpoints.length,
      spanDays: span,
      meanIntake: Math.round(meanIntake),
      daysNeeded,
      slope: regRecent && regRecent.slope ? regRecent.slope : 0,
      trendWeight: trendNow == null ? null : Math.round(trendNow * 10) / 10,
      budget: budgetFor(tdee, tgt),
      windowStart: start,
      windowEnd: end
    };
  }

  /* ---------------- 单日汇总与区间 ---------------- */
  const ERR = { high: 0.06, med: 0.16, low: 0.3 };
  function confOf(e) {
    if (e.conf) return e.conf;
    if (e.source === 'ai') return 'low';
    if (e.source === 'lib' || e.source === 'combo') return 'high';
    return 'med';
  }
  function summary(entries, dateKey) {
    const list = (entries || []).filter(e => (e.date || e.dateKey) === dateKey);
    const s = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, low: 0, high: 0, count: list.length, items: list, byMeal: {} };
    MEALS.forEach(m => { s.byMeal[m[0]] = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, items: [], low: 0, high: 0 }; });
    list.forEach(e => {
      const kcal = Math.max(0, Number(e.kcal) || 0);
      const err = ERR[confOf(e)] != null ? ERR[confOf(e)] : 0.16;
      s.kcal += kcal;
      s.p += Number(e.p) || 0;
      s.c += Number(e.c) || 0;
      s.f += Number(e.f) || 0;
      s.fib += Number(e.fib) || 0;
      s.low += kcal * (1 - err);
      s.high += kcal * (1 + err);
      const m = s.byMeal[e.meal] || s.byMeal.snack;
      m.kcal += kcal;
      m.p += Number(e.p) || 0;
      m.c += Number(e.c) || 0;
      m.f += Number(e.f) || 0;
      m.fib += Number(e.fib) || 0;
      m.items.push(e);
      m.low += kcal * (1 - err);
      m.high += kcal * (1 + err);
    });
    s.low = Math.round(s.low);
    s.high = Math.round(s.high);
    s.kcal = Math.round(s.kcal);
    s.p = Math.round(s.p);
    s.c = Math.round(s.c);
    s.f = Math.round(s.f);
    s.fib = Math.round(s.fib);
    Object.keys(s.byMeal).forEach(k => {
      const m = s.byMeal[k];
      m.kcal = Math.round(m.kcal); m.p = Math.round(m.p); m.fib = Math.round(m.fib);
      m.low = Math.round(m.low); m.high = Math.round(m.high);
    });
    return s;
  }

  function burnedByDate(exercises, dateKey) {
    return (exercises || []).filter(x => (x.date || x.dateKey) === dateKey)
      .reduce((s, x) => s + Math.max(0, Number(x.kcal) || 0), 0);
  }

  function entryKcal(e, grams) {
    if (grams != null && e.per100 > 0) return Math.round(e.per100 * grams / 100);
    return Math.round(Number(e.kcal) || 0);
  }

  function streak(entries, today) {
    const days = new Set((entries || []).map(e => e.date || e.dateKey));
    let k = days.has(today) ? today : addDays(today, -1);
    if (!days.has(k)) return 0;
    let n = 0;
    while (days.has(k) && n < 999) { n++; k = addDays(k, -1); }
    return n;
  }

  /* ---------------- 预测 ---------------- */
  function forecast(weights, targetKg, today, windowDays) {
    const end = today || todayKey();
    const start = addDays(end, -(windowDays || 28) + 1);
    const map = weightMap(weights);
    const pts = Object.keys(map).filter(k => k >= start && k <= end).sort()
      .map(k => ({ x: daysBetween(start, k), y: map[k], key: k }));
    if (pts.length < 4 || daysBetween(pts[0].key, pts[pts.length - 1].key) < 10) return null;
    const reg = regress(pts);
    if (!reg) return null;
    const series = trendSeries(weights, start, end);
    const now = series.length ? series[series.length - 1].tw : pts[pts.length - 1].y;
    const weekly = reg.slope * 7;
    const fourWeek = now + reg.slope * 28;
    let etaDays = null;
    if (targetKg && Math.abs(targetKg - now) > 1 && Math.abs(reg.slope) > 0.002) {
      const toward = (targetKg - now) * reg.slope > 0;
      if (toward) etaDays = Math.round((targetKg - now) / reg.slope);
    }
    return {
      now: Math.round(now * 10) / 10,
      weekly: Math.round(weekly * 100) / 100,
      fourWeek: Math.round(fourWeek * 10) / 10,
      etaDays,
      slope: reg.slope,
      points: pts.length,
      start: start
    };
  }

  /* ---------------- 洞察 ---------------- */
  function insights(entries, weights, profile, tgt, ad, today, days) {
    const n = days || 14;
    const end = today || todayKey();
    const keys = rangeKeys(end, n);
    const daily = keys.map(k => {
      const s = summary(entries, k);
      return { date: k, kcal: s.kcal, p: s.p, fib: s.fib, logged: s.count > 0 };
    });
    const logged = daily.filter(d => d.logged);
    const avgIntake = logged.length ? Math.round(logged.reduce((s, d) => s + d.kcal, 0) / logged.length) : 0;
    const within = daily.filter(d => d.logged && d.kcal <= ad.budget * 1.03).length;
    const proteinHit = daily.filter(d => d.logged && d.p >= tgt.protein * 0.9).length;
    const avgProtein = logged.length ? Math.round(logged.reduce((s, d) => s + d.p, 0) / logged.length) : 0;
    const avgFiber = logged.length ? Math.round(logged.reduce((s, d) => s + d.fib, 0) / logged.length) : 0;

    const series = trendSeries(weights, keys[0], end);
    let delta = null;
    if (series.length > 3) delta = Math.round((series[series.length - 1].tw - series[0].tw) * 10) / 10;

    const wk = daily.filter(d => d.logged && !isWeekend(d.date));
    const we = daily.filter(d => d.logged && isWeekend(d.date));
    const wkAvg = wk.length ? Math.round(wk.reduce((s, d) => s + d.kcal, 0) / wk.length) : 0;
    const weAvg = we.length ? Math.round(we.reduce((s, d) => s + d.kcal, 0) / we.length) : 0;

    const coverage = Math.round(logged.length / n * 100);
    const narrative = [];
    if (logged.length < 4) {
      narrative.push('这段时间只记录了 ' + logged.length + ' 天，账本还不足以判断趋势。先把「记一天」变成习惯，校准会更快。');
    } else {
      narrative.push('过去 ' + n + ' 天你记账 ' + logged.length + ' 天，平均摄入 ' + avgIntake.toLocaleString() + ' kcal，'
        + (avgIntake <= ad.budget ? '比预算低 ' + (ad.budget - avgIntake) + ' kcal。' : '比预算高 ' + (avgIntake - ad.budget) + ' kcal。'));
      if (delta != null) {
        narrative.push('体重趋势' + (delta === 0 ? '基本持平' : (delta > 0 ? '上升 ' : '下降 ') + Math.abs(delta) + ' kg') + '。'
          + (ad.status === 'calibrated' ? '按 7,700 kcal/kg 反推，你的真实消耗约为 ' + ad.tdee + ' kcal/天，比公式估计'
            + (ad.tdee >= ad.prior ? '高 ' : '低 ') + Math.abs(ad.tdee - ad.prior) + ' kcal。' : '足够的体重与摄入记录之后，这里会给出你的真实消耗。'));
      }
      if (logged.length >= 5) {
        narrative.push('蛋白质平均 ' + avgProtein + ' g，达标 ' + proteinHit + ' 天；膳食纤维平均 ' + avgFiber + ' g。'
          + (avgProtein < tgt.protein * 0.85 ? '蛋白质是当前最值得补的一项。' : '蛋白质完成得不错。'));
      }
      if (wk.length >= 2 && we.length >= 2 && Math.abs(weAvg - wkAvg) > 80) {
        narrative.push('周末平均 ' + weAvg + ' kcal，工作日 ' + wkAvg + ' kcal，相差 ' + Math.abs(weAvg - wkAvg) + ' kcal——这是最明显的波动来源。');
      }
    }
    return {
      days: n, loggedDays: logged.length, coverage, avgIntake, within, proteinHit,
      avgProtein, avgFiber, delta, weekdayAvg: wkAvg, weekendAvg: weAvg,
      narrative, daily, budget: ad.budget
    };
  }

  /* ---------------- 下一餐 ---------------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function r5(v) { return Math.round(v / 5) * 5; }

  function nextBite(opts) {
    const foods = opts.foods || FOODS;
    const remaining = Math.round(opts.remaining || 0);
    const gap = Math.max(0, Math.round(opts.proteinGap || 0));
    const meal = opts.meal || guessMeal();
    const seed = opts.seed || 0;

    if (remaining <= 0) {
      return { type: 'over', items: [], totals: { kcal: 0, p: 0 }, text: '今天已经超出预算。下一顿以蔬菜和蛋白质为主，主食减半就好。' };
    }
    if (remaining <= 140) {
      return { type: 'done', items: [], totals: { kcal: 0, p: 0 }, text: '预算基本用完。如果还饿，喝水或无糖茶，等下一餐。' };
    }

    const mealBudget = Math.min(remaining, clamp(remaining * 0.45, 220, 720));
    const prefer = {
      breakfast: { protein: /蛋|奶|酸奶|鸡胸/, carb: /燕麦|面包|馒头|吐司|贝果/, veg: true },
      lunch: { protein: /鸡|牛|猪|鱼|虾|豆腐|蛋/, carb: /米饭|面|藜麦|红薯|玉米|土豆/, veg: true },
      dinner: { protein: /鱼|虾|豆腐|鸡|牛|蛋/, carb: /红薯|玉米|糙米|米饭|面|南瓜/, veg: true },
      snack: { protein: /酸奶|牛奶|鸡蛋|豆浆/, carb: /面包|水果|玉米/, veg: false }
    }[meal] || { veg: true };

    const pPool = foods.filter(f => f.p >= 8 && f.kcal > 0 && [1, 2, 3].indexOf(f.cat) > -1);
    const cPool = foods.filter(f => f.cat === 0);
    const vPool = foods.filter(f => f.cat === 4);
    const lightPool = foods.filter(f => (f.cat === 5 || f.cat === 3 || f.cat === 6) && f.kcal > 0);

    function pick(pool, bonus) {
      if (!pool.length) return null;
      const scored = pool.map(f => {
        let s = (f.p / Math.max(f.kcal, 1)) * 100;
        if (bonus && bonus.test(f.name)) s += 12;
        s += (seed % 3) * 0.01;
        return { f, s };
      }).sort((a, b) => b.s - a.s);
      return scored[Math.min(seed, scored.length - 1)].f;
    }

    const proteinF = pick(pPool, prefer.protein);
    let carbF = pick(cPool, prefer.carb);
    let vegF = prefer.veg !== false ? pick(vPool, null) : null;

    if (!proteinF) return { type: 'empty', items: [], totals: { kcal: 0, p: 0 }, text: '食物库为空，先在设置里添加几种常吃的食物。' };

    const items = [];
    function add(f, grams) {
      grams = Math.max(5, r5(grams));
      const kcal = Math.round(f.kcal * grams / 100);
      items.push({
        name: f.name, grams, kcal,
        p: Math.round(f.p * grams / 100 * 10) / 10,
        c: Math.round(f.c * grams / 100 * 10) / 10,
        f: Math.round(f.f * grams / 100 * 10) / 10,
        fib: Math.round(f.fib * grams / 100 * 10) / 10,
        cat: f.catName, per100: f.kcal,
        p100: f.p, c100: f.c, f100: f.f, fib100: f.fib
      });
      return kcal;
    }

    let used = 0;
    const pNeed = clamp(Math.max(gap * 0.8, 18), 18, 48);
    let pGrams = clamp(pNeed * 100 / proteinF.p, 50, 220);
    used += add(proteinF, pGrams);
    if (vegF) {
      used += add(vegF, meal === 'snack' ? 100 : 180);
    }
    if (carbF) {
      const left = mealBudget - used - 40;
      let cGrams = clamp(left * 100 / carbF.kcal, 40, 240);
      used += add(carbF, cGrams);
    }
    // 预算过高时补一份水果/坚果
    if (used < mealBudget * 0.65 && remaining > 380 && lightPool.length) {
      const extra = pick(lightPool, null);
      if (extra && extra.id !== proteinF.id) used += add(extra, extra.unitG || 100);
    }
    // 超预算则先削减主食
    while (used > remaining * 1.03 && items.length > 1) {
      const idx = items.map((x, i) => ({ x, i })).filter(o => o.x.cat === '主食').map(o => o.i)[0];
      if (idx == null) break;
      const item = items[idx];
      if (item.grams <= 45) { used -= item.kcal; items.splice(idx, 1); break; }
      const cut = Math.min(30, item.grams - 40);
      const oldKcal = item.kcal;
      item.grams -= cut;
      item.kcal = Math.round(item.p100 && item.per100 ? item.per100 * item.grams / 100 : oldKcal);
      item.p = Math.round(item.p100 * item.grams / 100 * 10) / 10;
      item.c = Math.round(item.c100 * item.grams / 100 * 10) / 10;
      item.f = Math.round(item.f100 * item.grams / 100 * 10) / 10;
      item.fib = Math.round(item.fib100 * item.grams / 100 * 10) / 10;
      used -= oldKcal - item.kcal;
    }
    // 仍然超出：削减蛋白来源（最少 40g）
    let guard = 0;
    while (used > remaining * 1.03 && guard < 12) {
      guard++;
      const idx = items.map((x, i) => ({ x, i })).filter(o => o.x.p100 >= 8).map(o => o.i)[0];
      if (idx == null) break;
      const item = items[idx];
      if (item.grams <= 45) { used -= item.kcal; items.splice(idx, 1); break; }
      const cut = Math.min(15, item.grams - 40);
      const oldKcal = item.kcal;
      item.grams -= cut;
      item.kcal = Math.round(item.per100 * item.grams / 100);
      item.p = Math.round(item.p100 * item.grams / 100 * 10) / 10;
      item.c = Math.round(item.c100 * item.grams / 100 * 10) / 10;
      item.f = Math.round(item.f100 * item.grams / 100 * 10) / 10;
      item.fib = Math.round(item.fib100 * item.grams / 100 * 10) / 10;
      used -= oldKcal - item.kcal;
    }

    const totalKcal = items.reduce((s, x) => s + x.kcal, 0);
    const totalP = Math.round(items.reduce((s, x) => s + x.p, 0) * 10) / 10;
    const pct = Math.round(totalKcal / Math.max(1, remaining) * 100);
    let text;
    if (gap > 15) text = '蛋白质还差 ' + gap + ' g，这一组能补 ' + totalP + ' g，约占今日剩余的 ' + pct + '%。';
    else if (remaining > 600) text = '蛋白已接近目标，这组以稳定血糖和饱腹为主，约占今日剩余的 ' + pct + '%。';
    else text = '这一组刚好收尾，约占今日剩余的 ' + pct + '%。';

    return {
      type: 'plan', meal, items, totals: { kcal: totalKcal, p: totalP },
      text, mealBudget, remaining, proteinGap: gap
    };
  }

  /* ---------------- 组合/示例 ---------------- */
  function toFood(row) {
    return {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: row.name, cat: row.cat == null ? 0 : row.cat,
      catName: CATS[row.cat] || '自定义',
      kcal: Number(row.kcal) || 0, p: Number(row.p) || 0, c: Number(row.c) || 0,
      f: Number(row.f) || 0, fib: Number(row.fib) || 0,
      unitG: Number(row.unitG) || 0, unit: row.unit || '', aliases: [], custom: true
    };
  }

  function burn(mets, kg, minutes) {
    return Math.round(Number(mets) * Number(kg) * (Number(minutes) / 60) * 1.05);
  }

  global.Engine = {
    KCAL_PER_KG, ERR, CATS, FOODS, EXERCISES, MEALS, ACTIVITIES,
    keyOf, dateOf, todayKey, addDays, rangeKeys, weekday, isWeekend, dateLabel, fullLabel,
    shortLabel, daysBetween, relativeDay,
    searchFoods, foodByName, mealLabel, guessMeal, norm,
    targets, budgetFor, regress, weightMap, trendSeries, latestWeight,
    adaptive, summary, burnedByDate, entryKcal, streak, forecast, insights, nextBite,
    toFood, burn, confOf
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* assets/wellness.js */
/* 能量账本 · 身体与周期模块
   周期相位、经期水分窗口、关键营养、饮食偏好过滤、就诊摘要。
   纯计算，不直接操作 DOM。 */
(function (global) {
  'use strict';
  const E = global.Engine;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const round1 = n => Math.round(n * 10) / 10;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (isFinite(Number(n)) ? Math.round(Number(n)).toLocaleString('en-US') : '—');

  /* ---------------- 周期 ---------------- */
  const PHASES = {
    menstrual: { key: 'menstrual', label: '经期', short: '经期', color: '#B86B5E' },
    follicular: { key: 'follicular', label: '卵泡期', short: '卵泡', color: '#7FA98A' },
    ovulation: { key: 'ovulation', label: '排卵期', short: '排卵', color: '#C79A52' },
    luteal: { key: 'luteal', label: '黄体期', short: '黄体', color: '#9B8AAE' }
  };

  function cleanCycle(cycle) {
    if (!cycle || !cycle.enabled || !cycle.lastStart) return null;
    const length = clamp(Math.round(Number(cycle.length) || 28), 21, 40);
    const periodLength = clamp(Math.round(Number(cycle.periodLength) || 5), 2, 10);
    return {
      enabled: true,
      lastStart: cycle.lastStart,
      length,
      periodLength,
      history: Array.isArray(cycle.history) ? cycle.history.slice(-12) : []
    };
  }

  function phaseFromDay(day, length, periodLength) {
    const ovulation = length - 14;
    if (day <= periodLength) return PHASES.menstrual;
    if (day < ovulation) return PHASES.follicular;
    if (day <= ovulation + 1) return PHASES.ovulation;
    return PHASES.luteal;
  }

  function cycleInfo(cycle, today) {
    const c = cleanCycle(cycle);
    if (!c) return null;
    const date = today || E.todayKey();
    const diff = E.daysBetween(c.lastStart, date);
    if (diff < 0) return null;
    const cycleIndex = Math.floor(diff / c.length);
    const day = (diff - cycleIndex * c.length) + 1;
    const nextStart = E.addDays(c.lastStart, (cycleIndex + 1) * c.length);
    const phase = phaseFromDay(day, c.length, c.periodLength);
    return {
      phase: phase.key,
      phaseLabel: phase.label,
      phaseShort: phase.short,
      color: phase.color,
      day: day,
      length: c.length,
      periodLength: c.periodLength,
      nextStart: nextStart,
      daysToNext: E.daysBetween(date, nextStart),
      cycleIndex: cycleIndex,
      lastStart: c.lastStart
    };
  }

  function phaseForDate(date, cycle) {
    const c = cleanCycle(cycle);
    if (!c) return null;
    let diff = E.daysBetween(c.lastStart, date);
    const idx = Math.floor(diff / c.length);
    const day = diff - idx * c.length + 1;
    const phase = phaseFromDay(day, c.length, c.periodLength);
    return {
      phase: phase.key,
      phaseLabel: phase.label,
      phaseShort: phase.short,
      color: phase.color,
      day: day,
      length: c.length,
      periodLength: c.periodLength
    };
  }

  // 经期 + 黄体最后 5 天视为水分窗口，自适应 TDEE 校准时排除
  function isWaterWindow(date, cycle) {
    const p = phaseForDate(date, cycle);
    if (!p) return false;
    if (p.phase === 'menstrual') return true;
    return p.phase === 'luteal' && p.day >= p.length - 4;
  }

  function filterWeights(weights, cycle) {
    const c = cleanCycle(cycle);
    if (!c || !weights || !weights.length) return { weights: weights || [], excluded: 0 };
    const kept = [];
    let excluded = 0;
    weights.forEach(w => {
      if (isWaterWindow(w.date, c)) excluded++;
      else kept.push(w);
    });
    // 排除后样本太少就退回全部，避免把校准做废
    if (kept.length < 5) return { weights: weights, excluded: 0, fallback: true };
    return { weights: kept, excluded, fallback: false };
  }

  function cycleStrip(keys, cycle) {
    const c = cleanCycle(cycle);
    if (!c) return [];
    return keys.map(k => {
      const p = phaseForDate(k, c);
      return { date: k, phase: p.phase, label: p.phaseShort, color: p.color, day: p.day };
    });
  }

  /* ---------------- 关键营养（每 100g，参考值） ---------------- */
  // [铁 mg, 钙 mg, 维生素D µg, 叶酸 µg]
  const NUTRIENTS = {
    '米饭（熟）': [0.3, 7, 0, 3],
    '糙米饭（熟）': [0.8, 10, 0, 20],
    '杂粮饭（熟）': [1.0, 15, 0, 25],
    '藜麦（熟）': [1.5, 17, 0, 42],
    '燕麦片（干）': [4.3, 54, 0, 30],
    '全麦面包': [2.5, 40, 0, 30],
    '白吐司': [1.0, 30, 0, 20],
    '面条（熟）': [0.6, 10, 0, 10],
    '荞麦面（熟）': [1.0, 15, 0, 20],
    '玉米（煮）': [1.1, 10, 0, 25],
    '红薯（蒸）': [0.6, 30, 0, 11],
    '紫薯（蒸）': [0.8, 25, 0, 10],
    '土豆（蒸）': [0.8, 12, 0, 15],
    '鸡胸肉（熟）': [0.7, 11, 0.1, 4],
    '鸡腿肉（去皮熟）': [0.9, 12, 0.1, 5],

  function nutrientTargets(profile) {
    const p = profile || {};

    if (gn) {
      return {
        iron: older ? gn.ironOlder : gn.iron,
        calcium: older ? gn.calciumOlder : gn.calcium,
        vd: older ? gn.vdOlder : gn.vd,
        folate: gn.folate
      };
    }
    const female = p.sex === 'female';
    return {
      iron: female ? (older ? 12 : 20) : 12,
      calcium: older ? 1000 : 800,
      vd: older ? 15 : 10,
      folate: 400
    };
  }

  function nutrientTotals(entries, supplements) {
    const totals = { iron: 0, calcium: 0, vd: 0, folate: 0 };
    (entries || []).forEach(e => {
      const n = NUTRIENTS[e.name];
      if (!n) return;
      const g = (Number(e.grams) || 100) / 100;
      totals.iron += n[0] * g;
      totals.calcium += n[1] * g;
      totals.vd += n[2] * g;
      totals.folate += n[3] * g;
    });
    (supplements || []).forEach(s => {
      totals.iron += Number(s.iron) || 0;
      totals.calcium += Number(s.calcium) || 0;
    });
    return {
      iron: round1(totals.iron),
      calcium: Math.round(totals.calcium),
      vd: round1(totals.vd),
      folate: Math.round(totals.folate)
    };

  const DAIRY_RE = /(牛奶|酸奶|奶酪|芝士|奶油|黄油|拿铁|卡布奇诺|摩卡|冰淇淋|奶茶|乳酪|乳清)/;
  const GLUTEN_RE = /(面条|面包|馒头|花卷|饺子|馄饨|包子|油条|煎饼|烧饼|饼干|蛋糕|披萨|意大利面|吐司|贝果|燕麦|曲奇|泡芙|小笼包|肉夹馍|手抓饼|烤冷面)/;
  const PORK_RE = /(猪|培根|火腿|香肠|午餐肉|排骨|五花|猪蹄|猪肝)/;

  function filterFoods(foods, prefs) {
    const p = prefs || {};

      const n = String(f.name || '');
      if (p.vegetarian && MEAT_RE.test(n)) return false;
      if (p.lactoseFree && DAIRY_RE.test(n)) return false;
      if (p.glutenFree && GLUTEN_RE.test(n)) return false;
      if (p.halal && PORK_RE.test(n)) return false;
      return true;
    });
  }

<script>
/* assets/extras.js */
/* 能量账本 · v3.2 扩展层
   纯逻辑：力量训练 PR、菜谱/购物清单合并、周报卡片绘制、可穿戴解析、照片压缩与 IndexedDB。
   不直接读写 localStorage；所有业务数据由 app.js 统一保存。 */
(function (global) {
  'use strict';

  /* ============================================================
     力量训练：Epley 1RM 与 PR
     ============================================================ */
  function epley(weight, reps) {
    const w = Number(weight) || 0;
    const r = Math.max(1, Number(reps) || 1);
    return Math.round(w * (1 + r / 30) * 10) / 10;
  }

  function prStats(lifts) {
    const groups = {};
    (lifts || []).forEach(x => {
      const name = String(x.exercise || '').trim();
      if (!name) return;
      const w = Number(x.weight) || 0;
      const r = Math.max(1, Number(x.reps) || 1);
      const g = groups[name] || (groups[name] = { exercise: name, bestWeight: 0, bestReps: 0, bestE1rm: 0, sets: 0, lastDate: '' });
      g.sets += 1;
      if (w > g.bestWeight || (w === g.bestWeight && r > g.bestReps)) {
        g.bestWeight = w;
        g.bestReps = r;
      }
      if (w > 0) g.bestE1rm = Math.max(g.bestE1rm, epley(w, r));
      if ((x.date || '') > g.lastDate) g.lastDate = x.date || '';
    });
    return Object.keys(groups).map(k => groups[k]).sort((a, b) => b.bestE1rm - a.bestE1rm);
  }

  function liftCSV(lifts) {
    const rows = [['日期', '动作', '组数', '重量kg', '次数', '估算1RMkg', '备注']];
    (lifts || []).slice().sort((a, b) => ((a.date || '') + (a.createdAt || 0)) < ((b.date || '') + (b.createdAt || 0)) ? -1 : 1).forEach(x => {
      rows.push([x.date || '', x.exercise || '', x.sets || 0, x.weight || 0, x.reps || 0, epley(x.weight, x.reps), x.note || '']);
    });
    return '\uFEFF' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  }

  /* ============================================================
     菜谱 / 购物清单
     ============================================================ */
  function shoppingFromRecipe(recipe) {
    const map = {};
    (recipe && recipe.items || []).forEach(it => {
      const name = String(it.name || '').trim();
      if (!name) return;
      const grams = Number(it.grams) || 0;
      if (!map[name]) map[name] = { name: name, grams: 0, checked: false };
      map[name].grams += grams;
    });
    return Object.keys(map).map(k => map[k]);
  }

  /* ============================================================
     可穿戴导入
     ============================================================ */
  function parseCSVRows(text) {
    const clean = String(text || '').replace(/^\uFEFF/, '');
    const firstLine = clean.split(/\r?\n/)[0] || '';
    const comma = (firstLine.match(/,/g) || []).length;
    const semi = (firstLine.match(/;/g) || []).length;
    const tab = (firstLine.match(/\t/g) || []).length;
    const delim = semi > comma && semi > tab ? ';' : (tab > comma && tab > semi ? '\t' : ',');
    const rows = [];
    let row = [];
    let field = '';
    let quoted = false;
    for (let i = 0; i < clean.length; i++) {
      const ch = clean[i];
      if (quoted) {
        if (ch === '"') {
          if (clean[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') { /* ignore */ }
      else field += ch;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => String(v).trim() !== ''));
  }

  function parseDateValue(v) {
    const s = String(v || '').trim();
    let m = s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
    m = s.match(/(\d{4})(\d{2})(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    return '';
  }

  function numValue(v) {
    const s = String(v == null ? '' : v).replace(/,/g, '').replace(/[^\d.\-]/g, '');
    const n = Number(s);
    return isFinite(n) ? n : null;
  }

  function parseSleepValue(v, header) {
    const raw = String(v == null ? '' : v).trim();
    const h = String(header || '').toLowerCase();
    if (!raw) return null;
    let m = raw.match(/(\d+)\s*(?:h|小时)\s*(\d+)?\s*(?:m|分)?/i);
    if (m) return Math.round((Number(m[1]) + (Number(m[2] || 0) / 60)) * 100) / 100;
    m = raw.match(/(\d{1,2}):(\d{2})/);
    if (m) return Math.round((Number(m[1]) + Number(m[2]) / 60) * 100) / 100;
    const n = numValue(raw);
    if (n == null) return null;
    if (/分钟|min/.test(h)) return Math.round(n / 60 * 100) / 100;
    if (/小时|hour|\bh\b/.test(h)) return Math.round(n * 100) / 100;
    if (n > 24) return Math.round(n / 60 * 100) / 100;
    return Math.round(n * 100) / 100;
  }

  function parseHuaweiCSV(text) {
    const rows = parseCSVRows(text);
    if (!rows.length) throw new Error('CSV 里没有数据行');
    const header = rows[0].map(s => String(s).toLowerCase().replace(/\s+/g, ''));
    const find = pats => {
      for (let i = 0; i < header.length; i++) {
        for (let j = 0; j < pats.length; j++) if (header[i].indexOf(pats[j]) > -1) return i;
      }
      return -1;
    };
    const dateIdx = find(['日期', 'date']) > -1 ? find(['日期', 'date']) : find(['时间', 'time', 'day']);
    const stepIdx = find(['步数', 'steps', 'step']);
    const weightIdx = find(['体重', 'bodyweight', 'weight']);
    const sleepIdx = find(['睡眠', 'sleep']);
    if (dateIdx < 0 || stepIdx < 0 && weightIdx < 0 && sleepIdx < 0) {
      throw new Error('没有识别到日期 + 步数/体重/睡眠列，请确认是华为运动健康导出的 CSV');
    }
    const steps = {};
    const weight = {};
    const sleep = {};
    const warnings = [];
    let rowsUsed = 0;
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const date = parseDateValue(r[dateIdx]);
      if (!date) continue;
      let used = false;
      if (stepIdx > -1) {
        const n = numValue(r[stepIdx]);
        if (n != null && n >= 0) { steps[date] = (steps[date] || 0) + Math.round(n); used = true; }
      }
      if (weightIdx > -1) {
        const n = numValue(r[weightIdx]);
        if (n != null && n > 0) {
          const isJin = /斤/.test(header[weightIdx]);
          const isLb = /lb|磅/.test(header[weightIdx]);
          const kg = Math.round((isJin ? n / 2 : isLb ? n * 0.453592 : n) * 10) / 10;
          if (kg >= 20 && kg <= 350) { weight[date] = kg; used = true; }
          else warnings.push(date + ' 体重 ' + n + ' 超出常见范围，已跳过');
        }
      }
      if (sleepIdx > -1) {
        const h = parseSleepValue(r[sleepIdx], header[sleepIdx]);
        if (h != null && h > 0 && h <= 24) { sleep[date] = Math.round(((sleep[date] || 0) + h) * 100) / 100; used = true; }
      }
      if (used) rowsUsed++;
    }
    return { source: 'huawei', steps: steps, weight: weight, sleep: sleep, unsupported: {}, warnings: warnings, rowsUsed: rowsUsed };
  }

  function parseAppleHealth(xmlText) {
    if (typeof DOMParser === 'undefined') throw new Error('当前环境无法解析 XML');
    const doc = new DOMParser().parseFromString(String(xmlText || ''), 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('XML 格式错误，无法解析');
    const records = Array.prototype.slice.call(doc.getElementsByTagName('Record'));
    if (!records.length) throw new Error('没有找到 Apple Health 的 Record 记录');
    const stepGroups = {};
    const sleepGroups = {};
    const steps = {};
    const weight = {};
    const sleep = {};
    const unsupported = {};
    const warnings = [];
    let rowsUsed = 0;
    records.forEach(rec => {
      const type = rec.getAttribute('type') || '';
      const start = rec.getAttribute('startDate') || '';
      const end = rec.getAttribute('endDate') || '';
      const value = rec.getAttribute('value');
      const unit = (rec.getAttribute('unit') || '').toLowerCase();
      const source = rec.getAttribute('sourceName') || '未标注来源';
      const sDate = parseDateValue(start.slice(0, 10));
      if (/StepCount/i.test(type)) {
        const n = numValue(value);
        if (!sDate || n == null) return;
        const key = sDate + '|' + source;
        stepGroups[key] = (stepGroups[key] || 0) + Math.max(0, n);
        rowsUsed++;
      } else if (/BodyMass|BodyWeight/i.test(type)) {
        const n = numValue(value);
        if (!sDate || n == null || n <= 0) return;
        const kg = unit === 'lb' ? n * 0.453592 : n;
        if (kg >= 20 && kg <= 350) { weight[sDate] = Math.round(kg * 10) / 10; rowsUsed++; }
        else warnings.push(sDate + ' 体重 ' + n + ' ' + unit + ' 超出常见范围，已跳过');
      } else if (/SleepAnalysis/i.test(type)) {
        const eDate = parseDateValue(end.slice(0, 10)) || sDate;
        const s = start ? new Date(start) : null;
        const e = end ? new Date(end) : null;
        if (!sDate || !eDate || !s || !e || !isFinite(s.getTime()) || !isFinite(e.getTime())) return;
        if (/Awake|InBed/i.test(value || '')) return;
        const mins = Math.max(0, (e.getTime() - s.getTime()) / 60000);
        if (mins <= 0) return;
        const key = eDate + '|' + source;
        sleepGroups[key] = (sleepGroups[key] || 0) + mins;
        rowsUsed++;
      } else if (type) {
        unsupported[type] = (unsupported[type] || 0) + 1;
      }
    });
    const collapse = groups => {
      const out = {};
      Object.keys(groups).forEach(k => {
        const date = k.split('|')[0];
        out[date] = Math.max(out[date] || 0, groups[k]);
      });
      return out;
    };
    const stepDaily = collapse(stepGroups);
    const sleepDaily = collapse(sleepGroups);
    Object.keys(stepDaily).forEach(d => { steps[d] = Math.round(stepDaily[d]); });
    Object.keys(sleepDaily).forEach(d => { sleep[d] = Math.round(sleepDaily[d] / 60 * 100) / 100; });
    return { source: 'apple', steps: steps, weight: weight, sleep: sleep, unsupported: unsupported, warnings: warnings, rowsUsed: rowsUsed };
  }

  function hasWearableData(p) {
    return !!(p && Object.keys(p.steps || {}).length + Object.keys(p.weight || {}).length + Object.keys(p.sleep || {}).length);
  }

  function previewImport(parsed, db) {
    const dates = {};
    ['steps', 'weight', 'sleep'].forEach(k => Object.keys(parsed[k] || {}).forEach(d => { dates[d] = 1; }));
    const wmap = {};
    (db.weights || []).forEach(w => { if (w.date) wmap[w.date] = w.kg; });
    const wearable = db.wearable || {};
    const rows = Object.keys(dates).sort().reverse().map(date => {
      const cur = wearable[date] || {};
      const row = { date: date, steps: parsed.steps[date], weight: parsed.weight[date], sleep: parsed.sleep[date], current: { steps: cur.steps, sleepH: cur.sleepH, weight: wmap[date] } };
      row.conflicts = [];
      if (row.weight != null && wmap[date] != null) row.conflicts.push('weight');
      if (row.steps != null && cur.steps != null) row.conflicts.push('steps');
      if (row.sleep != null && cur.sleepH != null) row.conflicts.push('sleep');
      return row;
    });
    const conflicts = [];
    rows.forEach(r => r.conflicts.forEach(t => conflicts.push(t + ':' + r.date)));
    return { rows: rows, conflicts: conflicts, totals: { steps: Object.keys(parsed.steps || {}).length, weight: Object.keys(parsed.weight || {}).length, sleep: Object.keys(parsed.sleep || {}).length } };
  }

  function applyImport(parsed, db, decisions) {
    const skip = k => !!(decisions && decisions[k]);
    const stats = { weight: 0, weightSkipped: 0, steps: 0, stepsSkipped: 0, sleep: 0, sleepSkipped: 0 };
    if (!db.wearable || typeof db.wearable !== 'object') db.wearable = {};
    Object.keys(parsed.weight || {}).forEach(date => {
      if (skip('weight:' + date)) { stats.weightSkipped++; return; }
      const kg = parsed.weight[date];
      db.weights = (db.weights || []).filter(w => w.date !== date);
      db.weights.push({ date: date, kg: kg });
      stats.weight++;
    });
    Object.keys(parsed.steps || {}).forEach(date => {
      if (skip('steps:' + date)) { stats.stepsSkipped++; return; }
      const cur = db.wearable[date] || {};
      db.wearable[date] = Object.assign({}, cur, { steps: parsed.steps[date], source: parsed.source || cur.source || 'import', at: Date.now() });
      stats.steps++;
    });
    Object.keys(parsed.sleep || {}).forEach(date => {
      if (skip('sleep:' + date)) { stats.sleepSkipped++; return; }
      const cur = db.wearable[date] || {};
      db.wearable[date] = Object.assign({}, cur, { sleepH: parsed.sleep[date], source: parsed.source || cur.source || 'import', at: Date.now() });
      stats.sleep++;
    });
    return stats;
  }

  /* ============================================================
     进度照片：压缩 + IndexedDB
     ============================================================ */
  const PHOTO_DB = 'energy-ledger-photos';
  const PHOTO_STORE = 'photos';
  let photoDBCache = null;

  function openPhotoDB() {
    if (!global.indexedDB) return Promise.reject(new Error('当前浏览器不支持 IndexedDB，照片无法保存在本机'));
    if (photoDBCache) return Promise.resolve(photoDBCache);
    return new Promise((resolve, reject) => {
      const req = global.indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(PHOTO_STORE)) {
          const store = db.createObjectStore(PHOTO_STORE, { keyPath: 'id' });
          store.createIndex('date', 'date', { unique: false });
        }
      };
      req.onsuccess = () => { photoDBCache = req.result; resolve(req.result); };
      req.onerror = () => reject(req.error || new Error('照片库打开失败'));
    });
  }

  function photoTx(mode, fn) {
    return openPhotoDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, mode);
      const store = tx.objectStore(PHOTO_STORE);
      let result;
      try { result = fn(store); } catch (e) { reject(e); return; }
      tx.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
      tx.onerror = () => reject(tx.error || new Error('照片库读写失败'));
      tx.onabort = () => reject(tx.error || new Error('照片写入被中止（可能空间不足）'));
    }));
  }

  function photosAll() {
    return photoTx('readonly', store => {
      const out = { __req: store.getAll() };
      return out;
    }).then(list => (list || []).sort((a, b) => (b.at || 0) - (a.at || 0)));
  }

  function photoDelete(id) { return photoTx('readwrite', store => store.delete(id)); }
  function photoClear() { return photoTx('readwrite', store => store.clear()); }

  function quotaRoom(bytes) {
    if (!global.navigator || !navigator.storage || !navigator.storage.estimate) return Promise.resolve(true);
    return navigator.storage.estimate().then(e => {
      if (!e || !e.quota) return true;
      return (e.usage || 0) + (bytes || 0) < e.quota * 0.98;
    }).catch(() => true);
  }

  function photoAdd(rec) {
    return quotaRoom(Number(rec.stored) || rec.bytes || 0).then(room => {
      if (!room) {
        const err = new Error('浏览器配额几乎用尽，请先清理照片或导出备份');
        err.code = 'quota';
        throw err;
      }
      return photoTx('readwrite', store => store.add(rec));
    }).catch(err => {
      if (err && err.name === 'QuotaExceededError') {
        const e2 = new Error('浏览器配额已满，照片没有保存');
        e2.code = 'quota';
        throw e2;
      }
      throw err;
    });
  }

  function photoStats(list) {
    const bytes = (list || []).reduce((s, p) => s + (Number(p.bytes) || 0), 0);
    const base = { count: (list || []).length, bytes: bytes };
    if (!global.navigator || !navigator.storage || !navigator.storage.estimate) {
      return Promise.resolve(Object.assign(base, { usage: null, quota: null }));
    }
    return navigator.storage.estimate().then(e => Object.assign(base, { usage: (e && e.usage) || 0, quota: (e && e.quota) || 0 })).catch(() => Object.assign(base, { usage: null, quota: null }));
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('图片解码失败：可能是不支持的格式（如 HEIC），请先转成 JPEG/PNG'));
      img.src = url;
    });
  }

  function compressImage(file, maxSide) {
    const limit = maxSide || 1080;
    if (!file || !/^image\//.test(file.type || '')) {
      return Promise.reject(new Error('不是图片文件（需要 JPEG/PNG/WebP 等）'));
    }
    const url = URL.createObjectURL(file);
    return loadImage(url).then(img => {
      const w0 = img.naturalWidth || img.width;
      const h0 = img.naturalHeight || img.height;
      if (!w0 || !h0) throw new Error('图片尺寸为 0，无法压缩');
      const scale = Math.min(1, limit / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale));
      const h = Math.max(1, Math.round(h0 * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.82);
      return { w: w, h: h, data: data, bytes: Math.round(data.length * 0.75), original: { w: w0, h: h0 } };
    }).then(res => { URL.revokeObjectURL(url); return res; }, err => { URL.revokeObjectURL(url); throw err; });
  }

  /* ============================================================
     周报卡片绘制（Canvas，无第三方依赖）
     ============================================================ */
  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawWeekCard(canvas, data) {
    const W = 1080;
    const H = 1620;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const font = (size, weight) => (weight || 500) + ' ' + size + 'px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
    ctx.fillStyle = '#F2EFE7';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2C6B51';
    ctx.fillRect(0, 0, W, 420);
    ctx.fillStyle = '#F7F5ED';
    ctx.font = font(30, 600);
    ctx.fillText('ENERGY LEDGER', 80, 96);
    ctx.font = font(74, 600);
    ctx.fillText(data.title + '回顾', 80, 210);
    ctx.font = font(30, 400);
    ctx.fillStyle = 'rgba(247,245,237,.82)';
    ctx.fillText(data.range, 80, 270);
    ctx.fillText('只在本机生成 · 不含账号与云端', 80, 320);
    ctx.fillStyle = '#F7F5ED';
    ctx.font = font(52, 600);
    ctx.fillText(data.badge || '', 80, 375);

    const stats = data.stats || [];
    const cards = [[80, 470], [560, 470], [80, 750], [560, 750]];
    stats.slice(0, 4).forEach((s, i) => {
      const p = cards[i];
      ctx.fillStyle = '#FBFAF5';
      roundRect(ctx, p[0], p[1], 440, 240, 24);
      ctx.fill();
      ctx.fillStyle = '#6F7A72';
      ctx.font = font(26, 400);
      ctx.fillText(s.label, p[0] + 30, p[1] + 56);
      ctx.fillStyle = s.tone === 'amber' ? '#B7791F' : (s.tone === 'red' ? '#A6473B' : '#1F2421');
      ctx.font = font(58, 600);
      ctx.fillText(s.value, p[0] + 30, p[1] + 136);
      ctx.fillStyle = '#8A938C';
      ctx.font = font(23, 400);
      ctx.fillText(s.sub || '', p[0] + 30, p[1] + 192);
    });

    const chartY = 1060;
    const chartH = 360;
    ctx.fillStyle = '#1F2421';
    ctx.font = font(34, 600);
    ctx.fillText('每日摄入', 80, chartY - 32);
    ctx.fillStyle = '#6F7A72';
    ctx.font = font(24, 400);
    ctx.fillText('虚线为每日预算', 260, chartY - 32);
    ctx.fillStyle = '#FBFAF5';
    roundRect(ctx, 80, chartY, 920, chartH, 24);
    ctx.fill();

    const days = data.days || [];
    const baseY = chartY + chartH - 60;
    const max = Math.max(1, data.budget || 1, Math.max.apply(null, days.map(d => d.kcal || 0)));
    const slot = 920 / Math.max(1, days.length);
    const barW = Math.min(74, slot * 0.52);
    const budgetY = baseY - (data.budget || 0) / max * (chartH - 130);
    ctx.strokeStyle = '#C9C2B2';
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(100, budgetY);
    ctx.lineTo(1000, budgetY);
    ctx.stroke();
    ctx.setLineDash([]);
    days.forEach((d, i) => {
      const x = 100 + slot * i + (slot - barW) / 2;
      const h = Math.max(4, (d.kcal || 0) / max * (chartH - 130));
      ctx.fillStyle = d.logged ? (d.kcal > (data.budget || 0) * 1.1 ? '#C08B5C' : '#2C6B51') : '#DED8CA';
      roundRect(ctx, x, baseY - h, barW, h, 10);
      ctx.fill();
      ctx.fillStyle = '#6F7A72';
      ctx.font = font(21, 400);
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x + barW / 2, baseY + 36);
      if (d.logged) {
        ctx.fillStyle = '#8A938C';
        ctx.font = font(19, 400);
        ctx.fillText(String(Math.round(d.kcal)), x + barW / 2, baseY - h - 12);
      }
      ctx.textAlign = 'left';
    });

    ctx.fillStyle = '#2C6B51';
    ctx.font = font(26, 500);
    ctx.fillText(data.footer || '', 80, 1500);
    ctx.fillStyle = '#8A938C';
    ctx.font = font(22, 400);
    ctx.fillText(data.generated || '', 80, 1542);
    ctx.fillText('所有数值为估算，不构成医疗或营养处方。', 80, 1578);
  }

  global.Extras = {
    epley: epley,
    prStats: prStats,
    liftCSV: liftCSV,
    shoppingFromRecipe: shoppingFromRecipe,
    parseHuaweiCSV: parseHuaweiCSV,

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* assets/app.js */
/* 能量账本 · 应用层

(function () {
  'use strict';

  const E = window.Engine;
  const W = window.Wellness;
  const G = window.Gender;
  const X = window.Extras;
  const DATA = window.LEDGER_DATA;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const icon = (n, cls) => '<svg class="' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (isFinite(Number(n)) ? Math.round(Number(n)).toLocaleString('en-US') : '—');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pct = (v, max) => clamp(max > 0 ? v / max * 100 : 0, 0, 100);
  const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const round1 = n => Math.round(n * 10) / 10;
  const round5 = n => Math.round(n / 5) * 5;
  const STATIC_MODE = (function () {
    const meta = document.querySelector('meta[name="ledger-mode"]');
    return !!(meta && meta.getAttribute('content') === 'static');
  })();
  const AI_GLM = { baseURL: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4v-flash' };
  const AI_QWEN = { baseURL: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-vl-max' };
  const AI_DEFAULT = STATIC_MODE ? AI_QWEN : AI_GLM;

  /* ============================================================
     存储
     ============================================================ */
  const KEY = 'energy-ledger.v2';
  const DEFAULT_DB = {
    version: 2,
    createdAt: Date.now(),
    onboarded: false,
    profile: null,
    settings: {
      theme: 'auto',
      ai: Object.assign({ key: '' }, AI_DEFAULT),
      demo: false,
      gentle: false,
      pin: { on: false, hash: '' },
      prefs: { vegetarian: false, lactoseFree: false, glutenFree: false, halal: false }
    },
    entries: [],
    weights: [],
    exercises: [],
    foods: [],
    combos: [],
    water: {},
    notes: {},
    cycle: { enabled: false, lastStart: '', length: 28, periodLength: 5, history: [] },
    measures: [],
    checkins: [],
    supplements: [],
    stats: { aiCalls: 0, aiOk: 0, aiFail: 0, aiMs: 0 },
    logs: [],
    lifts: [],
    recipes: [],
    shopping: null,
    controlChecks: {},
    wearable: {}
  };

  function normalizeDB(raw) {
    const db = Object.assign({}, DEFAULT_DB, raw || {});
    db.settings = Object.assign({}, DEFAULT_DB.settings, db.settings || {});
    db.settings.ai = Object.assign({}, DEFAULT_DB.settings.ai, (db.settings || {}).ai || {});
    db.settings.prefs = Object.assign({}, DEFAULT_DB.settings.prefs, (db.settings || {}).prefs || {});
    db.settings.pin = Object.assign({ on: false, hash: '' }, (db.settings || {}).pin || {});
    if (STATIC_MODE && !db.settings.ai.key && (!db.settings.ai.baseURL || db.settings.ai.baseURL === AI_GLM.baseURL)) {
      db.settings.ai.baseURL = AI_QWEN.baseURL;
      db.settings.ai.model = AI_QWEN.model;
    }
    ['entries', 'weights', 'exercises', 'foods', 'combos', 'measures', 'checkins', 'supplements', 'logs', 'lifts', 'recipes'].forEach(k => {
      if (!Array.isArray(db[k])) db[k] = [];
    });
    db.lifts = db.lifts.map(x => ({
      id: x.id || uid(), date: x.date || x.dateKey || '', exercise: String(x.exercise || x.name || '').trim(),
      sets: Math.max(1, Number(x.sets) || 1), weight: Math.max(0, Number(x.weight) || 0),
      reps: Math.max(1, Number(x.reps) || 1), note: String(x.note || ''), createdAt: Number(x.createdAt) || Date.now()
    })).filter(x => x.date && x.exercise);
    db.recipes = db.recipes.map(r => ({
      id: r.id || uid(), name: String(r.name || '未命名菜谱'), at: Number(r.at) || Date.now(),
      items: (Array.isArray(r.items) ? r.items : []).map(it => ({
        name: String(it.name || ''), grams: Math.max(1, Number(it.grams) || 100),
        per100: Object.assign({ kcal: 0, p: 0, c: 0, f: 0, fib: 0 }, (it.per100 || {}))
      })).filter(it => it.name)
    })).filter(r => r.items.length);
    if (db.shopping && Array.isArray(db.shopping.items)) {
      db.shopping = {
        recipeId: db.shopping.recipeId || '', recipeName: db.shopping.recipeName || '',
        at: Number(db.shopping.at) || Date.now(),
        items: db.shopping.items.map(it => ({ name: String(it.name || ''), grams: Math.max(0, Number(it.grams) || 0), checked: !!it.checked })).filter(it => it.name)
      };
    } else db.shopping = null;
    if (!db.wearable || typeof db.wearable !== 'object' || Array.isArray(db.wearable)) db.wearable = {};
    if (!db.stats || typeof db.stats !== 'object') db.stats = { aiCalls: 0, aiOk: 0, aiFail: 0, aiMs: 0 };
    else db.stats = Object.assign({ aiCalls: 0, aiOk: 0, aiFail: 0, aiMs: 0 }, db.stats);
    db.logs = db.logs.slice(0, 30);
    if (!db.water || typeof db.water !== 'object') db.water = {};
    if (!db.notes || typeof db.notes !== 'object') db.notes = {};
    if (!db.controlChecks || typeof db.controlChecks !== 'object') db.controlChecks = {};
    if (!db.cycle || typeof db.cycle !== 'object') db.cycle = Object.assign({}, DEFAULT_DB.cycle);
    db.cycle = Object.assign({}, DEFAULT_DB.cycle, db.cycle);
    if (!Array.isArray(db.cycle.history)) db.cycle.history = [];
    db.entries.forEach(e => {
      if (!e.id) e.id = uid();
      if (!e.date && e.dateKey) e.date = e.dateKey;
      if (!e.conf) e.conf = e.source === 'ai' ? 'low' : (e.source === 'manual' || e.source === 'custom') ? 'high' : 'med';
    });
    db.weights = db.weights.map(w => ({ date: w.date || w.dateKey, kg: Number(w.kg != null ? w.kg : w.weight) })).filter(w => w.date && w.kg > 0);
    db.measures = db.measures.map(m => ({ id: m.id || uid(), date: m.date || m.dateKey, waist: Number(m.waist) || 0, hip: Number(m.hip) || 0, thigh: Number(m.thigh) || 0, note: m.note || '' })).filter(m => m.date);
    db.checkins = db.checkins.map(c => ({ id: c.id || uid(), date: c.date || c.dateKey, hunger: Number(c.hunger) || 3, craving: Number(c.craving) || 3, mood: Number(c.mood) || 3, symptoms: Array.isArray(c.symptoms) ? c.symptoms : [], note: c.note || '' })).filter(c => c.date);
    db.supplements = db.supplements.map(s => ({ id: s.id || uid(), date: s.date || s.dateKey, name: s.name || '', iron: Number(s.iron) || 0, calcium: Number(s.calcium) || 0, note: s.note || '' })).filter(s => s.date && s.name);
    if (db.profile && (!db.profile.sex || !Number(db.profile.age) || !Number(db.profile.height) || !Number(db.profile.weight))) {
      db.profile = null;
      db.onboarded = false;
    }
    return db;
  }

  let DB;
  let storageOK = true;
  function loadDB() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return normalizeDB({});
      return normalizeDB(JSON.parse(raw));
    } catch (err) {
      storageOK = false;
      console.warn('[账本] 本地存储不可用', err);
      return normalizeDB({});
    }
  }
  function probeStorage() {
    try {
      localStorage.setItem(KEY + '.probe', '1');
      localStorage.removeItem(KEY + '.probe');
      return true;
    } catch (err) {
      return false;
    }
  }
  function paintStorageBanner() {
    let el = document.getElementById('storageBanner');
    if (storageOK) {
      if (el) el.remove();
      return;
    }
    if (!el) {
      el = document.createElement('div');
      el.id = 'storageBanner';
      el.className = 'storage-banner';
      el.setAttribute('role', 'alert');
      document.body.appendChild(el);
    }
    el.innerHTML = '<span>本地存储写入失败：新记录可能不会保存。请先在设置里导出备份，再清理浏览器空间。</span>' +
      '<button class="btn-quiet tiny" data-act="open-settings">去设置</button>';
  }
  function saveDB(silent) {
    try {
      localStorage.setItem(KEY, JSON.stringify(DB));
      storageOK = true;
      paintStorageBanner();
      return true;
    } catch (err) {
      storageOK = false;
      paintStorageBanner();
      if (!silent) toast('保存失败：本地存储空间不足或被浏览器限制');
      return false;
    }
  }
  function commit(revert) {
    if (saveDB(true)) return true;
    if (revert) revert();
    toast('保存失败：新记录没有写入。请先导出备份，清理空间后再试');
    return false;
  }
  DB = loadDB();
  storageOK = storageOK && probeStorage();
  paintStorageBanner();

  /* ============================================================
     主题
     ============================================================ */
  const mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function resolvedTheme() {
    const pref = DB.settings.theme || 'auto';
    if (pref === 'auto') return mqDark && mqDark.matches ? 'dark' : 'light';
    return pref;
  }
  function applyTheme() {
    const t = resolvedTheme();
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-gentle', DB.settings.gentle ? '1' : '0');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#121714' : '#EFECE2');
  }
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', () => { if (DB.settings.theme === 'auto') applyTheme(); });

  /* ============================================================
     UI 基础
     ============================================================ */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  const state = {
    tab: 'today',
    recordDate: E.todayKey(),
    range: 14,
    nextSeed: 0,
    ob: null,
    sheet: null,
    sheetData: null,
    coach: null,
    coachBusy: false,
    coachLast: null,
    photos: null,
    weekCard: null
  };

  function setTab(tab) {
    state.tab = tab;
    $$('.rail-nav button, .tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $$('.view').forEach(v => { v.hidden = v.dataset.view !== tab; });
    renderActive();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function renderActive() {
    if (state.tab === 'today') renderToday();
    else if (state.tab === 'ledger') renderLedger();
    else if (state.tab === 'trend') renderTrend();
    else if (state.tab === 'body') renderBody();
    else if (state.tab === 'settings') renderSettings();
    updateRail();
  }
  function updateRail() {
    const today = E.todayKey();
    const st = E.streak(DB.entries, today);
    const rs = $('#railStreak');
    if (rs) rs.textContent = st;
    const ts = $('#topStreak');
    if (ts) ts.textContent = st > 0 ? '连续 ' + st + ' 天' : (DB.onboarded ? '从今天开始' : '尚未开始');
    const td = $('#topDate');
    if (td) td.textContent = E.dateLabel(today) + ' 周' + E.weekday(today);
  }

  /* ============================================================
     派生数据
     ============================================================ */
  function allFoods() {
    return W.filterFoods(E.FOODS.concat(DB.foods || []), DB.settings.prefs);
  }
  function currentWeight() {
    const w = E.latestWeight(DB.weights, DB.profile);
    return w ? w.kg : (DB.profile && DB.profile.weight) || 65;
  }
  function targetsNow() {
    if (!DB.profile) return null;
    return E.targets(DB.profile, currentWeight());
  }
  function snapshot(dateKey) {
    const t = targetsNow();
    if (!t) return null;
    const day = dateKey || E.todayKey();
    const gp = G.of(DB.profile);
    const cycleActive = !!(DB.cycle && DB.cycle.enabled && gp.cycleEnabled);
    const weightFeed = cycleActive ? W.filterWeights(DB.weights, DB.cycle) : { weights: DB.weights, excluded: 0 };
    const ad = E.adaptive(DB.entries, weightFeed.weights, DB.profile, t, day);
    const budget = ad.budget;
    const sum = E.summary(DB.entries, day);
    const burned = E.burnedByDate(DB.exercises, day);
    return { t, ad, budget, sum, burned, remain: budget - sum.kcal, day, cycleExcluded: weightFeed.excluded };
  }
  function recents(n) {
    const seen = {};
    const out = [];
    for (let i = DB.entries.length - 1; i >= 0 && out.length < (n || 6); i--) {
      const e = DB.entries[i];
      if (!e.name || seen[e.name]) continue;
      seen[e.name] = 1;
      out.push(e);
    }
    return out;
  }
  /* ============================================================
     v3.1 · 变更日志 / 撤销 / 运行统计 / 安全护栏
     ============================================================ */
  function logChange(text, undo) {
    if (!Array.isArray(DB.logs)) DB.logs = [];
    DB.logs.unshift({ id: uid(), at: Date.now(), text: text, undo: undo || null });
    DB.logs = DB.logs.slice(0, 30);
    saveDB(true);
  }

  function lastUndoable() {
    return (DB.logs || []).filter(x => x.undo)[0] || null;
  }

  function logTime(at) {
    const d = new Date(at || Date.now());
    const p = n => (n < 10 ? '0' : '') + n;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function undoLast() {
    const item = lastUndoable();
    if (!item) { toast('没有可撤销的操作'); return; }
    const u = item.undo;
    if (u.kind === 'entry') DB.entries.push(u.item);
    else if (u.kind === 'entry-edit') {
      const idx = DB.entries.findIndex(x => x.id === u.item.id);
      if (idx > -1) DB.entries[idx] = u.item; else DB.entries.push(u.item);
    }
    else if (u.kind === 'exercise') DB.exercises.push(u.item);
    else if (u.kind === 'supplement') DB.supplements.push(u.item);
    else if (u.kind === 'measure') DB.measures.push(u.item);
    else if (u.kind === 'food') DB.foods.push(u.item);
    else if (u.kind === 'combo') DB.combos.push(u.item);
    else if (u.kind === 'lift') DB.lifts.push(u.item);
    else if (u.kind === 'entry-add') DB.entries = DB.entries.filter(e => e.id !== u.item.id);
    else if (u.kind === 'batch') {
      const ids = new Set(u.items.map(x => x.id));
      DB.entries = DB.entries.filter(e => !ids.has(e.id));
    }
    else { toast('这条操作无法撤销'); return; }
    item.undo = null;
    item.text = item.text + '（已撤销）';
    saveDB();
    renderActive();
    toast('已撤销：' + item.text.replace('（已撤销）', ''));
  }

  function recordAI(ok, ms) {
    if (!DB.stats) DB.stats = { aiCalls: 0, aiOk: 0, aiFail: 0, aiMs: 0 };
    DB.stats.aiCalls += 1;
    if (ok) DB.stats.aiOk += 1; else DB.stats.aiFail += 1;
    DB.stats.aiMs += Math.max(0, ms || 0);
    saveDB(true);
  }

  function safetyGuard(st) {
    const today = E.todayKey();
    const items = [];
    if (!st || !st.t || !DB.profile) return items;
    const t = st.t;
    let lowStreak = 0;
    for (let i = 0; i < 3; i++) {
      const s = E.summary(DB.entries, E.addDays(today, -i));
      if (s.count === 0) { lowStreak = 0; break; }
      if (s.kcal < t.floor * 0.9) lowStreak += 1;
      else break;
    }
    if (lowStreak >= 3) {
      items.push({ tone: 'red', title: '连续 ' + lowStreak + ' 天低于安全下限', sub: '长期低于 ' + fmt(t.floor) + ' kcal 会影响恢复与代谢。如果是有意控制，请把下限当底线。' });
    }
    if (st.ad && Number(st.ad.slope) < -0.013 && (st.ad.weightDays || 0) >= 4) {
      const weekly = round1(Number(st.ad.slope) * 7);
      const pctW = DB.profile.weight ? Math.abs(weekly) / DB.profile.weight * 100 : 0;
      if (pctW > 1.1) {
        items.push({ tone: 'amber', title: '体重下降偏快', sub: '近 7 天约 ' + weekly + ' kg（约 ' + round1(pctW) + '% 体重），可能是水分，也可能是缺口过大。' });
      }
    }
    const lw = E.latestWeight(DB.weights, DB.profile);
    if (DB.entries.length && (!lw || E.daysBetween(lw.date, today) > 9)) {
      items.push({ tone: 'amber', title: '超过 9 天没有称重', sub: '趋势校准需要体重样本；同一时间、空腹称一次就够。', act: 'open-weight' });
    }
    const from = E.addDays(today, -6);
    const dayP = {};
    DB.entries.forEach(e => {
      if (e.date >= from && e.date <= today) dayP[e.date] = (dayP[e.date] || 0) + (Number(e.p) || 0);
    });
    const days = Object.keys(dayP);
    if (days.length >= 4 && t.protein > 0) {
      const avgP = days.reduce((s, k) => s + dayP[k], 0) / days.length;
      if (avgP < t.protein * 0.65) {
        items.push({ tone: 'amber', title: '蛋白质连续偏低', sub: '近 ' + days.length + ' 天平均 ' + Math.round(avgP) + 'g / 目标 ' + t.protein + 'g。蛋白质不足时，缺口更容易来自肌肉。' });
      }
    }
    return items.slice(0, 3);
  }

  function entryMacros(e) {
    if (e.per100 && e.grams) {
      const p = e.per100;
      return {
        kcal: Math.round(p.kcal * e.grams / 100),
        p: round1(p.p * e.grams / 100),
        c: round1(p.c * e.grams / 100),
        f: round1(p.f * e.grams / 100),
        fib: round1(p.fib * e.grams / 100)
      };
    }
    return { kcal: Math.round(Number(e.kcal) || 0), p: Number(e.p) || 0, c: Number(e.c) || 0, f: Number(e.f) || 0, fib: Number(e.fib) || 0 };
  }
  function makeEntry(food, grams, meal, dateKey, source, conf) {
    const g = Math.max(1, round1(grams));
    const kcal = Math.round(food.kcal * g / 100 * 10) / 10;
    return {
      id: uid(),
      date: dateKey,
      meal: meal,
      name: food.name,
      grams: g,
      per100: { kcal: food.kcal, p: food.p, c: food.c, f: food.f, fib: food.fib },
      kcal: Math.round(kcal),
      p: round1(food.p * g / 100),
      c: round1(food.c * g / 100),
      f: round1(food.f * g / 100),
      fib: round1(food.fib * g / 100),
      conf: conf || (source === 'ai' ? 'low' : (source === 'manual' || source === 'custom') ? 'high' : 'med'),
      source: source || 'lib',
      createdAt: Date.now()
    };
  }
  function addEntry(entry) {
    DB.entries.push(entry);
    saveDB();
  }

  /* ============================================================
     今日
     ============================================================ */
  function renderToday() {
    const view = $('#view-today');
    if (!DB.profile) { view.innerHTML = renderNeedsOnboard(); return; }
    const today = E.todayKey();
    const st = snapshot(today);
    if (!st) { view.innerHTML = renderNeedsOnboard(); return; }
    const { t, ad, budget, sum, burned, remain } = st;
    const streak = E.streak(DB.entries, today);
    const burnedNote = burned > 0;
    const scale = Math.max(budget, sum.high * 1.03, 1);
    const fillPct = sum.kcal / scale * 100;
    const bandLeft = sum.low / scale * 100;
    const bandW = Math.max(0.8, (sum.high - sum.low) / scale * 100);
    const tickPct = budget / scale * 100;
    const over = remain < 0;
    const meals = E.MEALS.map(m => {
      const s = sum.byMeal[m[0]];
      return { key: m[0], label: m[1], ...s };
    });

  function remainingText(remain, sum) {
    if (remain <= 0) return '今日预算已用完。';
    if (sum.kcal === 0) return '从第一笔开始，账本会用你自己的体重变化校准一切。';
    return '';
  }

  /* ---------- 创新：今日还差什么 ---------- */
  function adherenceStreak(budget, t) {
    let d = E.summary(DB.entries, E.todayKey()).count ? E.todayKey() : E.addDays(E.todayKey(), -1);
    let n = 0;
    while (n < 365) {
      const s = E.summary(DB.entries, d);
      if (!s.count) break;
      if (s.kcal > budget * 1.05 || s.kcal < budget * 0.85) break;
      n++;
      d = E.addDays(d, -1);
    }
    const next = [3, 7, 14, 30, 60, 100].find(m => m > n) || null;
    return { n: n, next: next, toNext: next ? next - n : 0 };
  }

  function gapNext(st, water) {
    const today = E.todayKey();
    const push = adherenceStreak(st.budget, st.t);
    const base = { streak: push };
    if (st.sum.count === 0) {
      return Object.assign(base, { kind: 'start', title: '先记下第一餐', sub: '有了第一笔，账本才会开始校准你的预算。', act: 'open-add', label: '记一餐' });
    }
    if (st.remain <= 0) {
      return Object.assign(base, { kind: 'over', title: '今天预算已用完', sub: '不必补偿，散散步或早点休息就好。', act: 'open-exercise', label: '记运动' });
    }
    const pGap = Math.max(0, st.t.protein - st.sum.p);
    const fiberGap = Math.max(0, st.t.fiber - st.sum.fib);
    const wGap = Math.max(0, st.t.water - water);
    if (pGap >= 8) {
      const cands = allFoods().filter(f => f.p >= 12 && f.kcal <= 260 && !/零食|薯片|蛋糕|可乐/.test(f.name))
        .filter(f => f.kcal * 1.5 <= st.remain && f.kcal * 0.5 <= st.remain);
      cands.sort((a, b) => (b.p / Math.max(1, b.kcal)) - (a.p / Math.max(1, a.kcal)));
      if (cands.length) {
        const f = cands[0];
        const g = f.kcal * 1.5 <= st.remain ? 150 : 100;
        return Object.assign(base, { kind: 'protein', title: '蛋白质还差 ' + Math.round(pGap) + 'g', sub: '一份 ' + f.name + ' ' + g + 'g 约补 ' + round1(f.p * g / 100) + 'g，热量也在今天剩余内。', act: 'gap-add', food: f.id, grams: g, label: '加 ' + g + 'g ' + f.name, pGap: pGap });
      }
    }
    if (wGap >= 250) {
      const ml = wGap >= 500 ? 500 : 250;
      return Object.assign(base, { kind: 'water', title: '饮水还差 ' + round1(wGap / 1000) + 'L', sub: '一次 ' + ml + 'ml，分几次喝完比一次灌更舒服。', act: 'quick-water', ml: ml, label: '+' + ml + 'ml 水' });
    }
    if (fiberGap >= 5) {
      const cands = allFoods().filter(f => f.fib >= 2.5 && f.kcal <= st.remain + 50)
        .sort((a, b) => (b.fib / Math.max(1, b.kcal)) - (a.fib / Math.max(1, a.kcal)));
      if (cands.length) {
        const f = cands[0];
        return Object.assign(base, { kind: 'fiber', title: '膳食纤维还差 ' + Math.round(fiberGap) + 'g', sub: '一份 ' + f.name + ' 150g 约补 ' + round1(f.fib * 1.5) + 'g。', act: 'gap-add', food: f.id, grams: 150, label: '加 150g ' + f.name });
      }
    }
    return Object.assign(base, { kind: 'done', title: '今天的关键项都够了', sub: push.n ? '已达标的连续天数：' + push.n + ' 天' + (push.next ? '，距 ' + push.next + ' 天里程碑还差 ' + push.toNext + ' 天' : '') : '蛋白质、纤维和饮水都在目标附近。' });
  }

  function renderGapCard(gap) {
    const ic = gap.kind === 'done' ? icon('check') : gap.kind === 'over' ? icon('info') : icon('plus');
    let btn = '';
    if (gap.act === 'gap-add') {
      btn = '<button class="btn btn-primary btn-sm" data-act="gap-add" data-food="' + gap.food + '" data-grams="' + gap.grams + '">' + esc(gap.label) + '</button>';
    } else if (gap.act === 'quick-water') {
      btn = '<button class="btn btn-primary btn-sm" data-act="quick-water" data-ml="' + gap.ml + '">' + esc(gap.label) + '</button>';
    } else if (gap.act) {
      btn = '<button class="btn btn-primary btn-sm" data-act="' + gap.act + '">' + esc(gap.label) + '</button>';
    }
    const st = gap.streak || { n: 0, next: 3, toNext: 3 };
    return '<section class="card gap-card gap-' + gap.kind + '">' +
      '<div class="gap-main"><span class="gap-ic">' + ic + '</span>' +
        '<div><div class="eyebrow">今天还差什么</div><div class="gap-title">' + esc(gap.title) + '</div><div class="gap-sub">' + esc(gap.sub) + '</div></div>' +
      '</div>' +
      (btn ? '<div class="gap-act">' + btn + '</div>' : '') +
      '<div class="gap-foot">' + icon('flame') + '<span>' + (st.n ? '连续达标 <b>' + st.n + ' 天</b>' + (st.next ? ' · 还差 ' + st.toNext + ' 天到 ' + st.next + ' 天里程碑' : ' · 已到最长里程碑') : '连续达标从今天开始 · 吃在预算内并记下来就算一天') + '</span></div>' +
    '</section>';
  }

  /* ============================================================
     账本
     ============================================================ */
  function renderLedger() {
    const view = $('#view-ledger');
    if (!DB.profile) { view.innerHTML = renderNeedsOnboard(); return; }
    const d = state.recordDate;
    const st = snapshot(d);
    if (!st) { view.innerHTML = renderNeedsOnboard(); return; }
    const { t, ad, budget, sum, burned, remain } = st;
    const isToday = d === E.todayKey();

  const CONTROL_META = {
    sugar: { key: 'sugar', label: '糖', full: '添加糖', unit: 'g', target: 25, cap: 50, color: 'sugar' },
    oil: { key: 'oil', label: '油', full: '烹调油', unit: 'g', target: 30, cap: 35, color: 'oil' },
    salt: { key: 'salt', label: '盐', full: '盐（当量）', unit: 'g', target: 5, cap: 5, color: 'salt' }

  function controlTotals(date) {
    const entries = DB.entries.filter(e => e.date === date);
    const t = { sugar: 0, oil: 0, salt: 0, sodium: 0, counted: 0, total: entries.length };
    entries.forEach(e => {
      if (!e.control) return;
      t.sugar += Number(e.control.sugar) || 0;
      t.oil += Number(e.control.oil) || 0;
      t.salt += Number(e.control.salt) || 0;
      t.sodium += Number(e.control.sodium) || 0;
      t.counted++;
    });
    t.sugar = round1(t.sugar); t.oil = round1(t.oil); t.salt = round1(t.salt); t.sodium = Math.round(t.sodium);
    return t;
  }

  function controlSources(date, key) {
    return DB.entries.filter(e => e.date === date && e.control && Number(e.control[key]) > 0)
      .map(e => ({ name: e.name, grams: e.grams, amt: Number(e.control[key]) || 0, kcal: e.kcal }))
      .sort((a, b) => b.amt - a.amt).slice(0, 4);
  }

  /* ---------- 创新：同上一餐一键复刻 ---------- */
  function repeatMeal(meal) {
    const target = state.tab === 'ledger' ? state.recordDate : E.todayKey();
    const priorDates = Array.from(new Set(DB.entries.filter(e => e.meal === meal && e.date < target).map(e => e.date))).sort().reverse();
    let src = null, list = [];
    for (const d of priorDates) {
      const items = DB.entries.filter(e => e.meal === meal && e.date === d);
      if (items.length) { src = d; list = items; break; }
    }
    if (!list.length) {
      toast('还没有可复刻的' + E.mealLabel(meal) + '，先完整记一餐吧');
      return;
    }
    const existing = DB.entries.filter(e => e.meal === meal && e.date === target).length;
    const doIt = () => {
      const before = DB.entries.length;
      const clones = list.map(e => Object.assign({}, e, { id: uid(), date: target, source: 'repeat', createdAt: Date.now() }));
      DB.entries.push.apply(DB.entries, clones);
      if (!commit(() => { DB.entries.length = before; })) return;
      logChange('复刻' + E.mealLabel(meal) + '「来自 ' + E.dateLabel(src) + '」· ' + clones.length + ' 项', { kind: 'batch', items: clones });
      renderActive();
      toast('已复刻 ' + clones.length + ' 项到' + E.mealLabel(meal) + ' · ' + fmt(clones.reduce((s, x) => s + x.kcal, 0)) + ' kcal');
    };
    if (existing) {
      confirmSheet('复刻上一餐？', '这一餐已有 ' + existing + ' 项，会再加 ' + list.length + ' 项。', '继续复刻', false).then(ok => { if (ok) doIt(); });
    } else doIt();
  }

  /* ============================================================
