<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="ledger-mode" content="static">
<meta name="ledger-standalone" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#EFECE2">
<meta name="description" content="能量账本：一本会自我校准的私人饮食账本。记录更少，知道更多。">
<title>能量账本 · 记录得更少，知道得更多</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B4F'/%3E%3Cpath d='M11 8v13.2c0 .9.8 1.5 1.8 1.5H22' fill='none' stroke='%23EFECE2' stroke-width='2'/%3E%3Cpath d='M15 12h5' stroke='%23EFECE2' stroke-width='2'/%3E%3C/svg%3E" type="image/svg+xml">
<style>
/* 能量账本 · 视觉层
   设计语言：纸本账簿。暖纸底、墨绿字、细分割线、衬线数字。
   不追求“数据仪表盘”的科技感，而是让人愿意每天打开一次。 */

:root {
  --paper: #EFECE2;
  --paper-deep: #E7E3D7;
  --surface: #FBF9F2;
  --surface-2: #F4F1E7;
  --field: #F6F3EA;
  --ink: #1D2A23;
  --ink-2: #55645A;
  --ink-3: #8A948B;
  --line: #E2DDCE;
  --line-2: #CFC8B5;
  --green: #2C6B51;
  --green-deep: #204E3C;
  --green-soft: #E4EDE4;
  --green-line: #BCD3C2;
  --amber: #B1773B;
  --amber-soft: #F6EBDD;
  --red: #A64A3C;
  --red-soft: #F5E3DE;
  --shadow: 0 14px 40px rgba(35, 52, 42, .08);
  --shadow-sm: 0 4px 14px rgba(35, 52, 42, .05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --radius: 18px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}

[data-theme="dark"] {
  --paper: #121714;
  --paper-deep: #0D1210;
  --surface: #191F1B;
  --surface-2: #202720;
  --field: #232A24;
  --ink: #ECE8DB;
  --ink-2: #A9B4A9;
  --ink-3: #78857C;
  --line: #2C352E;
  --line-2: #3B463D;
  --green: #7FB79A;
  --green-deep: #A6D2BA;
  --green-soft: #22322A;
  --green-line: #3C5B4A;
  --amber: #D6A36B;
  --amber-soft: #33291F;
  --red: #D98878;
  --red-soft: #35241F;
  --shadow: 0 18px 46px rgba(0, 0, 0, .34);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.62;
  color: var(--ink);
  background:
    radial-gradient(1100px 520px at 52% -8%, rgba(255, 253, 245, .9), transparent 70%),
    radial-gradient(900px 700px at 100% 100%, rgba(214, 226, 214, .35), transparent 65%),
    var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
[data-theme="dark"] body {
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(58, 80, 66, .22), transparent 70%),
    radial-gradient(700px 600px at 100% 100%, rgba(40, 58, 47, .28), transparent 65%),
    var(--paper);
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; text-align: inherit; }
a { color: inherit; }
img { display: block; max-width: 100%; }
::selection { background: var(--green-soft); }

.serif, .num, .balance-num, .stat-value, .big-num { font-family: var(--serif); font-variant-numeric: tabular-nums lining-nums; }

/* ---------- 布局 ---------- */
#app { min-height: 100vh; }
.app-shell { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }

.rail {
  display: none;
  position: sticky; top: 0;
  width: 232px; height: 100vh; flex-shrink: 0;
  padding: 30px 22px 26px;
  border-right: 1px solid var(--line);
  background: rgba(251, 249, 242, .55);
  backdrop-filter: blur(10px);
  flex-direction: column;
  z-index: 20;
}
[data-theme="dark"] .rail { background: rgba(25, 31, 27, .55); }

.rail-brand { display: flex; align-items: center; gap: 11px; padding: 0 4px 26px; }
.mark {
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
  background: var(--green); color: #F7F5EC;
  display: grid; place-items: center;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12);
}
.mark svg { width: 19px; height: 19px; }
.brand-name { font-family: var(--serif); font-size: 17px; letter-spacing: .01em; font-weight: 600; line-height: 1.2; }
.brand-en { font-size: 9px; letter-spacing: .18em; color: var(--ink-3); margin-top: 3px; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-nav button {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px; border-radius: 11px;
  color: var(--ink-2); font-size: 14px;
  transition: background .18s, color .18s;
}
.rail-nav button:hover { background: var(--surface-2); color: var(--ink); }
.rail-nav button.on { background: var(--green-soft); color: var(--green-deep); font-weight: 600; }
.rail-nav .idx { font-family: var(--serif); font-size: 10.5px; color: var(--ink-3); width: 18px; }
.rail-nav button.on .idx { color: var(--green); }
.rail-nav button i { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--green); opacity: 0; }
.rail-nav button.on i { opacity: 1; }

.rail-foot { margin-top: auto; padding-top: 22px; }
.rail-streak {
  border: 1px solid var(--line); border-radius: 13px;
  padding: 13px 14px; background: var(--surface);
}
.rail-streak .k { font-size: 10px; letter-spacing: .12em; color: var(--ink-3); }
.rail-streak .v { font-family: var(--serif); font-size: 25px; line-height: 1.2; margin-top: 3px; color: var(--green-deep); }
.rail-streak .v small { font-family: var(--sans); font-size: 11px; color: var(--ink-3); font-weight: 400; }
.rail-note { font-size: 10.5px; color: var(--ink-3); line-height: 1.7; margin-top: 14px; padding: 0 4px; }

.app-main { width: 100%; max-width: 680px; padding: 0 0 90px; }

.mobile-top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px;
  background: linear-gradient(to bottom, var(--paper) 62%, rgba(239, 236, 226, 0));
}
[data-theme="dark"] .mobile-top { background: linear-gradient(to bottom, var(--paper) 62%, rgba(18, 23, 20, 0)); }
.mobile-top .brand { display: flex; align-items: center; gap: 9px; }
.mobile-top .mark { width: 28px; height: 28px; border-radius: 8px; }
.mobile-top .brand-name { font-size: 15px; }
.mobile-top .date { font-size: 11.5px; color: var(--ink-3); text-align: right; line-height: 1.35; }
.mobile-top .date b { display: block; color: var(--ink-2); font-weight: 500; font-size: 12.5px; }

.page { padding: 2px 20px 10px; }
@media (min-width: 1024px) {
  .app-shell { justify-content: center; }
  .rail { display: flex; position: sticky; height: 100vh; }
  .app-main { padding-top: 30px; max-width: 720px; }
  .mobile-top { display: none; }
  .page { padding: 0 34px 30px; }
  .tabbar { display: none !important; }
  body { padding-bottom: 40px; }
}

/* ---------- 通用文字 ---------- */
.eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.kicker { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12px; }
.tiny { font-size: 10.5px; }
.strong { font-weight: 600; }
.green { color: var(--green); }
.amber { color: var(--amber); }
.red { color: var(--red); }
.nowrap { white-space: nowrap; }
.line { height: 1px; background: var(--line); border: 0; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

h1.page-title { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.page-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 22px; }

/* ---------- 卡片与区块 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
}
.card-flat { background: transparent; border: 1px solid var(--line); box-shadow: none; }
.card-tight { padding: 15px 18px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.section-head .act { font-size: 12px; color: var(--green); cursor: pointer; white-space: nowrap; }
.section-head .act:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 首页：余额 ---------- */
.hero {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 24px 24px 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(to bottom, transparent 0 47px, var(--line) 47px 48px);
  opacity: .28; pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(var(--green), var(--green-line));
}
.hero > * { position: relative; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-date { font-family: var(--serif); font-size: 14px; color: var(--ink-2); }
.hero-date b { font-weight: 600; color: var(--ink); }
.hero-streak {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--green-deep);
  background: var(--green-soft); border: 1px solid var(--green-line);
  padding: 4px 10px; border-radius: 20px; white-space: nowrap;
}
.hero-streak svg { width: 12px; height: 12px; }

.balance { margin-top: 16px; display: flex; align-items: baseline; gap: 8px; }
.balance-num { font-size: 64px; font-weight: 500; line-height: .98; letter-spacing: -.035em; color: var(--ink); }
.balance-num.neg { color: var(--red); }
.balance-unit { font-size: 13px; color: var(--ink-3); letter-spacing: .04em; }
.bal-cap { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.bal-cap b { color: var(--ink); font-weight: 600; }
.bal-cap .range { color: var(--ink-3); }

.meter { margin: 18px 0 0; height: 10px; border-radius: 6px; background: var(--surface-2); position: relative; overflow: visible; }
.meter-band {
  position: absolute; top: 0; bottom: 0; border-radius: 6px;
  background: repeating-linear-gradient(135deg, var(--line-2) 0 3px, transparent 3px 7px);
  opacity: .55;
}
.meter-fill {
  position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px;
  background: var(--green); transition: width .7s var(--ease);
}
.meter-fill.warn { background: linear-gradient(90deg, var(--amber), var(--red)); }
.meter-tick { position: absolute; top: -5px; bottom: -5px; width: 1.5px; background: var(--ink-3); opacity: .8; }
.meter-legend { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10px; color: var(--ink-3); }

.hero-stats { display: flex; gap: 0; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.hs-item { flex: 1; }
.hs-item + .hs-item { border-left: 1px solid var(--line); padding-left: 15px; }
.hs-item .n { font-family: var(--serif); font-size: 20px; line-height: 1.2; }
.hs-item .n small { font-family: var(--sans); font-size: 10px; color: var(--ink-3); margin-left: 2px; }
.hs-item .l { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.hs-item .n.amber { color: var(--amber); }
.hs-item .n.green { color: var(--green); }

.hero-note {
  margin-top: 14px; font-size: 10.5px; color: var(--ink-3); line-height: 1.7;
  display: flex; align-items: flex-start; gap: 7px;
}
.hero-note svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px; }

/* ---------- 宏量 ---------- */
.macro-card { padding: 16px 22px; }
.macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.macro { padding-right: 14px; }
.macro + .macro { border-left: 1px solid var(--line); padding-left: 16px; }
.macro .top { display: flex; align-items: baseline; justify-content: space-between; }
.macro .name { font-size: 11px; color: var(--ink-3); }
.macro .val { font-family: var(--serif); font-size: 17px; }
.macro .val small { font-family: var(--sans); font-size: 10px; color: var(--ink-3); }
.macro-bar { height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.macro-bar span { display: block; height: 100%; border-radius: 2px; background: var(--green); transition: width .6s var(--ease); }
.macro-bar span.amber { background: var(--amber); }
.macro-bar span.blue { background: #5C8398; }

/* ---------- 代谢校准 ---------- */
.calib { display: flex; align-items: flex-start; gap: 18px; }
.calib-left { flex: 1; min-width: 0; }
.calib-val { font-family: var(--serif); font-size: 26px; line-height: 1.15; }
.calib-val small { font-size: 11px; color: var(--ink-3); font-family: var(--sans); letter-spacing: .02em; }
.calib-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.calib-bar { height: 4px; background: var(--surface-2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.calib-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--green-line), var(--green)); border-radius: 3px; transition: width .8s var(--ease); }
.calib-right { width: 88px; flex-shrink: 0; text-align: right; }
.calib-ring { width: 78px; height: 78px; margin-left: auto; }
.calib-pct { font-family: var(--serif); font-size: 15px; margin-top: -54px; text-align: center; }
.calib-pct small { font-size: 9px; display: block; color: var(--ink-3); font-family: var(--sans); }

/* ---------- 下一餐 ---------- */
.next-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.next-badge { font-size: 10px; letter-spacing: .1em; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 20px; padding: 3px 9px; white-space: nowrap; }
.next-list { margin-top: 14px; }
.nb-row { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px dotted var(--line-2); }
.nb-row:last-child { border-bottom: 0; }
.nb-name { font-size: 13.5px; }
.nb-cat { font-size: 9.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.nb-dots { flex: 1; border-bottom: 1px dotted var(--line-2); transform: translateY(-4px); min-width: 12px; }
.nb-grams { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nb-kcal { font-family: var(--serif); font-size: 14px; width: 62px; text-align: right; }
.nb-total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
.nb-total .k { font-size: 11.5px; color: var(--ink-3); }
.nb-total .v { font-family: var(--serif); font-size: 20px; }
.next-actions { display: flex; gap: 9px; margin-top: 15px; }

/* ---------- 今日流水 ---------- */
.timeline { margin-top: 4px; }
.tl-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.tl-row:last-child { border-bottom: 0; padding-bottom: 2px; }
.tl-time { font-family: var(--serif); font-size: 11.5px; color: var(--ink-3); width: 46px; flex-shrink: 0; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.tl-dot.empty { background: transparent; border: 1px solid var(--line-2); }
.tl-main { flex: 1; min-width: 0; }
.tl-main .t { font-size: 13px; }
.tl-main .s { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.tl-kcal { font-family: var(--serif); font-size: 15px; white-space: nowrap; }
.tl-kcal.faint { font-family: var(--sans); font-size: 11px; }
.stamp { font-size: 9px; color: var(--green); border: 1px solid var(--green-line); border-radius: 4px; padding: 1px 5px; transform: rotate(-2deg); letter-spacing: .05em; }

/* ---------- 账本 ---------- */
.day-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.day-nav .center { text-align: center; }
.day-nav .d { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.day-nav .s { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.arrow-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); background: var(--surface); transition: .18s; }
.arrow-btn:hover { border-color: var(--line-2); background: var(--surface-2); color: var(--ink); }
.arrow-btn:disabled { opacity: .35; cursor: default; }
.arrow-btn svg { width: 15px; height: 15px; }

.day-summary { display: flex; gap: 0; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.ds-item { flex: 1; }
.ds-item + .ds-item { border-left: 1px solid var(--line); padding-left: 16px; }
.ds-item .v { font-family: var(--serif); font-size: 21px; line-height: 1.2; }
.ds-item .v small { font-size: 10px; font-family: var(--sans); color: var(--ink-3); }
.ds-item .k { font-size: 10.5px; color: var(--ink-3); }

.heat-strip { display: flex; gap: 5px; margin-top: 16px; }
.heat-cell { flex: 1; min-width: 0; text-align: center; }
.heat-cell .sq { height: 26px; border-radius: 5px; background: var(--surface-2); border: 1px solid transparent; position: relative; overflow: hidden; }
.heat-cell .sq span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--green-line); }
.heat-cell .sq.over span { background: var(--amber); }
.heat-cell .sq.today { border-color: var(--green); }
.heat-cell .lb { font-size: 8.5px; color: var(--ink-3); margin-top: 3px; }

.ledger-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tool-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; background: var(--surface); transition: .16s; }
.tool-btn:hover { border-color: var(--line-2); color: var(--ink); background: var(--surface-2); }
.tool-btn svg { width: 13px; height: 13px; }

.meal-block { margin-top: 18px; }
.meal-head { display: flex; align-items: center; gap: 9px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.meal-head .name { font-family: var(--serif); font-size: 15px; }
.meal-head .k { font-size: 10.5px; color: var(--ink-3); }
.meal-head .kcal { font-family: var(--serif); font-size: 15px; margin-left: auto; }
.meal-head .add { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
.meal-head .add:hover { background: var(--green-soft); color: var(--green); border-color: var(--green-line); }
.meal-head .add svg { width: 12px; height: 12px; }
.meal-head .repeat {
  height: 26px; padding: 0 8px; border-radius: 13px; border: 1px solid var(--line);
  font-size: 10.5px; color: var(--ink-2); background: var(--surface-2); flex-shrink: 0;
}
.meal-head .repeat:hover { color: var(--green); border-color: var(--green-line); background: var(--green-soft); }
.entry { display: flex; align-items: center; gap: 8px; padding: 9px 0 9px 2px; border-bottom: 1px dotted var(--line); font-size: 13px; }
.entry:last-child { border-bottom: 0; }
.entry .n { flex-shrink: 0; max-width: 58%; }
.entry .badge { flex-shrink: 0; }
.entry .p { font-size: 10px; color: var(--ink-3); flex-shrink: 0; }
.entry .dots { flex: 1; border-bottom: 1px dotted var(--line-2); transform: translateY(-4px); min-width: 8px; }
.entry .k { font-family: var(--serif); font-size: 14px; flex-shrink: 0; }
.entry .more { color: var(--ink-3); width: 18px; display: grid; place-items: center; flex-shrink: 0; }
.entry .more svg { width: 12px; height: 12px; }
.empty-meal { padding: 12px 2px; font-size: 11.5px; color: var(--ink-3); border-bottom: 1px dotted var(--line); }
.empty-meal:last-child { border-bottom: 0; }

.entry-actions { display: flex; gap: 6px; }
.icon-mini { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); border: 1px solid transparent; }
.icon-mini:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.icon-mini.danger:hover { color: var(--red); background: var(--red-soft); border-color: transparent; }
.icon-mini svg { width: 13px; height: 13px; }

.badge { font-size: 9px; line-height: 1.6; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-3); white-space: nowrap; }
.badge.high { color: var(--green); border-color: var(--green-line); background: var(--green-soft); }
.badge.med { color: var(--amber); border-color: #E3CBAF; background: var(--amber-soft); }
.badge.low { color: var(--red); border-color: #DDBDB5; background: var(--red-soft); }

.day-note { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--ink-3); }
.balance-line { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.balance-line .k { font-size: 11.5px; color: var(--ink-3); }
.balance-line .v { font-family: var(--serif); font-size: 18px; }

/* ---------- 趋势 ---------- */
.range-tabs { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.range-tabs button { font-size: 11.5px; padding: 5px 12px; border-radius: 8px; color: var(--ink-3); }
.range-tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }

.chart-card { padding: 18px 18px 10px; }
.chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.chart-title { font-family: var(--serif); font-size: 16px; }
.chart-sub { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; color: var(--ink-3); padding: 2px 2px 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-swatch { width: 13px; height: 3px; border-radius: 2px; }
.legend-swatch.line { background: var(--green); }
.legend-swatch.bar { background: var(--green-line); }
.legend-swatch.dash { background: repeating-linear-gradient(90deg, var(--amber) 0 3px, transparent 3px 6px); }
.chart-wrap { width: 100%; position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-empty { padding: 36px 10px; text-align: center; color: var(--ink-3); font-size: 12px; }

.forecast { display: flex; gap: 18px; margin-top: 6px; padding: 14px 2px 4px; border-top: 1px solid var(--line); }
.fc-item { flex: 1; }
.fc-item .k { font-size: 10px; color: var(--ink-3); letter-spacing: .04em; }
.fc-item .v { font-family: var(--serif); font-size: 19px; line-height: 1.25; margin-top: 2px; }
.fc-item .v small { font-family: var(--sans); font-size: 10px; color: var(--ink-3); }
.fc-item + .fc-item { border-left: 1px solid var(--line); padding-left: 16px; }

.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; margin-bottom: 18px; background: var(--surface); }
.stat-tile { padding: 14px 14px 12px; }
.stat-tile + .stat-tile { border-left: 1px solid var(--line); }
.stat-tile .v { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.stat-tile .v small { font-size: 9.5px; font-family: var(--sans); color: var(--ink-3); }
.stat-tile .k { font-size: 10px; color: var(--ink-3); margin-top: 3px; }

.narrative p { font-size: 13px; line-height: 1.85; color: var(--ink-2); margin-bottom: 11px; }
.narrative p:last-child { margin-bottom: 0; }
.narrative b { color: var(--ink); font-weight: 600; }
.review-sign { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-2); display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--ink-3); }
.review-sign .seal { font-family: var(--serif); color: var(--green); border: 1px solid var(--green-line); border-radius: 3px; padding: 2px 7px; transform: rotate(-2deg); letter-spacing: .1em; }

.pattern-list { display: flex; flex-direction: column; gap: 12px; }
.pattern-row .top { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; }
.pattern-row .top .v { font-family: var(--serif); font-size: 13px; color: var(--ink-2); }
.pattern-track { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; display: flex; overflow: hidden; }
.pattern-track span { display: block; height: 100%; }
.pattern-track .a { background: var(--green); }
.pattern-track .b { background: var(--green-line); }

.idea { padding: 14px 16px; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); font-size: 12px; line-height: 1.8; color: var(--ink-2); }
.idea b { color: var(--ink); }

/* ---------- 设置 ---------- */
.setting-group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 18px; }
.setting-group .gh { padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
.setting-group .gh .t { font-family: var(--serif); font-size: 15px; }
.setting-group .gh .s { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .l .t { font-size: 13px; }
.setting-row .l .s { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.6; }
.setting-row .r { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; flex-shrink: 0; }
.setting-row .r svg { width: 13px; height: 13px; }
.setting-row.danger .l .t { color: var(--red); }

.profile-brief { display: flex; align-items: center; gap: 16px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--green-line); font-family: var(--serif); font-size: 19px; flex-shrink: 0; }
.profile-brief .name { font-family: var(--serif); font-size: 18px; }
.profile-brief .meta { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }

.engine-bars { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.engine-bar .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); }
.engine-bar .top b { font-family: var(--serif); font-size: 13px; color: var(--ink); }
.engine-track { height: 7px; background: var(--surface-2); border-radius: 4px; margin-top: 4px; position: relative; overflow: hidden; }
.engine-track span { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.engine-track .prior { background: var(--line-2); }
.engine-track .final { background: var(--green); }
.engine-track .obs { background: var(--amber); }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 11px; padding: 11px 18px; font-size: 13px; font-weight: 500; transition: transform .15s, background .18s, color .18s, border-color .18s; }
.btn:active { transform: scale(.985); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--green); color: #FBFAF1; box-shadow: 0 4px 12px rgba(44, 107, 81, .2); }
.btn-primary:hover { background: var(--green-deep); }
.btn-ghost { border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-quiet { color: var(--ink-3); padding: 8px 10px; }
.btn-quiet:hover { color: var(--ink); background: var(--surface-2); }
.btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid transparent; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- 存储告警 ---------- */
.storage-banner {
  position: fixed; left: 50%; top: 10px; transform: translateX(-50%);
  z-index: 96; width: min(560px, calc(100% - 20px));
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px;
  background: var(--red-soft); border: 1px solid rgba(160, 60, 45, .3);
  color: var(--red); font-size: 11.5px; line-height: 1.5;
  box-shadow: var(--shadow-sm);
}
.storage-banner span { flex: 1; }

/* ---------- 浮层 ---------- */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 80;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(19, 28, 23, .42);
  backdrop-filter: blur(3px);
  padding: 0;
  animation: fadein .18s ease;
}
.sheet {
  width: 100%; max-width: 580px; max-height: 91vh;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px 22px 0 0; box-shadow: 0 -20px 60px rgba(20, 30, 24, .22);
  display: flex; flex-direction: column;
  animation: sheetup .3s var(--ease);
}
@keyframes sheetup { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.sheet-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 20px 13px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 22px 22px 0 0; }
.sheet-head .t { font-family: var(--serif); font-size: 18px; }
.sheet-head .s { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
.sheet-close { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); background: var(--surface-2); flex-shrink: 0; }
.sheet-close:hover { color: var(--ink); }
.sheet-close svg { width: 14px; height: 14px; }
.sheet-body { padding: 16px 20px 22px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }
.sheet-foot { position: sticky; bottom: 0; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; }
.sheet-foot .btn-primary { flex: 1; }
@media (min-width: 720px) {
  .sheet-wrap { align-items: center; padding: 30px; }
  .sheet { border-radius: 20px; max-height: 86vh; animation: fadeup .24s var(--ease); }
  .sheet-head { border-radius: 20px 20px 0 0; }
  @keyframes fadeup { from { transform: translateY(10px); opacity: .5; } to { transform: none; opacity: 1; } }
}

/* ---------- 表单 ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 6px; letter-spacing: .02em; }
.input, .select {
  width: 100%; background: var(--field); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font-size: 13.5px; outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.input:focus, .select:focus { border-color: var(--green-line); box-shadow: 0 0 0 3px rgba(44, 107, 81, .1); }
.input::placeholder { color: var(--ink-3); opacity: .8; }
.input-num { font-family: var(--serif); font-size: 18px; text-align: center; padding: 9px 8px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }

.seg { display: flex; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 7px 4px; border-radius: 8px; font-size: 12px; color: var(--ink-3); transition: .16s; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }

.search-box { position: relative; }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); }
.search-box .input { padding-left: 36px; }

/* ---------- 添加食物 ---------- */
.meal-seg { margin-bottom: 14px; }
.search-caption { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
.search-caption .k { font-size: 10px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11.5px; border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px; color: var(--ink-2); background: var(--surface); transition: .15s; }
.chip:hover { border-color: var(--green-line); color: var(--green); background: var(--green-soft); }
.chip .n { color: var(--ink-3); font-size: 10px; margin-left: 3px; }

.pick-list { margin-top: 10px; max-height: 300px; overflow-y: auto; border-top: 1px solid var(--line); }
.pick-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.pick-row:hover { background: var(--surface-2); }
.pick-row .n { font-size: 13px; }
.pick-row .c { font-size: 9.5px; color: var(--ink-3); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; margin-left: 4px; }
.pick-row .k { margin-left: auto; font-family: var(--serif); font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.pick-row .add-i { width: 22px; height: 22px; border-radius: 50%; border: 1px dashed var(--line-2); display: grid; place-items: center; color: var(--ink-3); flex-shrink: 0; }
.pick-row:hover .add-i { color: var(--green); border-color: var(--green); }
.pick-row .add-i svg { width: 11px; height: 11px; }

.cart { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.cart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.cart-head .t { font-family: var(--serif); font-size: 15px; }
.cart-head .s { font-size: 10.5px; color: var(--ink-3); }
.cart-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.cart-row .n { flex: 1; font-size: 12.5px; min-width: 0; }
.cart-row .n small { display: block; color: var(--ink-3); font-size: 9.5px; }
.cart-row .g { width: 54px; text-align: center; padding-left: 4px; padding-right: 4px; }
.cart-row .k { font-family: var(--serif); font-size: 13px; width: 48px; text-align: right; }
.cart-row .x { color: var(--ink-3); width: 26px; min-height: 38px; display: grid; place-items: center; }
.cart-row .x:hover { color: var(--red); }
.cart-row .x svg { width: 13px; height: 13px; }
.step { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.step-btn { width: 38px; height: 38px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--ink-2); font-size: 17px; line-height: 1; display: grid; place-items: center; }
.step-btn:hover { border-color: var(--green-line); color: var(--green); }
.step-btn:active { background: var(--green-soft); }
.step .input { text-align: center; }
.form-grid .step .input { width: 92px; }
.cart-empty { font-size: 11.5px; color: var(--ink-3); padding: 12px 0; }
.cart-total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
.cart-total .k { font-size: 11px; color: var(--ink-3); }
.cart-total .v { font-family: var(--serif); font-size: 20px; }
.cart-total .v small { font-family: var(--sans); font-size: 10px; color: var(--ink-3); }
.combo-strip { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 6px; margin-top: 8px; }
.combo-card { flex-shrink: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; background: var(--surface); text-align: left; }
.combo-card:hover { border-color: var(--green-line); background: var(--green-soft); }
.combo-card .n { font-size: 11.5px; }
.combo-card .k { font-size: 9.5px; color: var(--ink-3); margin-top: 1px; }

.portion-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.portion-chips button { font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink-2); }
.portion-chips button:hover { border-color: var(--green-line); color: var(--green); }

/* ---------- 运动 ---------- */
.ex-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; }
.ex-row:hover { background: var(--surface-2); }
.ex-row .n { font-size: 13px; }
.ex-row .m { font-size: 9.5px; color: var(--ink-3); margin-left: 5px; }
.ex-row .k { margin-left: auto; font-family: var(--serif); font-size: 12px; color: var(--ink-3); }
.ex-calc { margin-top: 16px; padding: 14px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }
.ex-calc .v { font-family: var(--serif); font-size: 26px; }
.ex-calc .v small { font-size: 10px; color: var(--ink-3); font-family: var(--sans); }
.ex-calc .note { font-size: 10.5px; color: var(--ink-3); line-height: 1.7; margin-top: 4px; }
.ex-list-today { margin-top: 14px; }
.ex-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dotted var(--line); font-size: 12px; }
.ex-item .k { margin-left: auto; font-family: var(--serif); font-size: 13px; }
.ex-item .x { color: var(--ink-3); }
.ex-item .x svg { width: 11px; height: 11px; }

/* ---------- 体重 ---------- */
.weight-big { text-align: center; padding: 8px 0 4px; }
.weight-big .n { font-family: var(--serif); font-size: 54px; line-height: 1; letter-spacing: -.02em; }
.weight-big .n small { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-left: 4px; }
.weight-big .s { font-size: 11px; color: var(--ink-3); margin-top: 7px; }
.weight-stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
.weight-stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.weight-stepper button:hover { background: var(--surface-2); }
.weight-stepper input { width: 90px; text-align: center; font-family: var(--serif); font-size: 20px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 7px; }
.weight-trend { margin-top: 16px; display: flex; gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.weight-trend .i { flex: 1; }
.weight-trend .i .k { font-size: 10px; color: var(--ink-3); }
.weight-trend .i .v { font-family: var(--serif); font-size: 18px; margin-top: 2px; }

/* ---------- 引导 ---------- */
.onboard-wrap { position: fixed; inset: 0; z-index: 100; background: var(--paper); display: flex; align-items: flex-start; justify-content: center; padding: 32px 24px; overflow-y: auto; }
.onboard { width: 100%; max-width: 520px; margin: auto; }
.ob-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
.ob-dots { display: flex; gap: 5px; margin-bottom: 14px; }
.ob-dots span { height: 3px; border-radius: 2px; background: var(--line-2); flex: 1; transition: background .3s; }
.ob-dots span.on { background: var(--green); }
.ob-step { animation: fadein .24s ease; }
.ob-title { font-family: var(--serif); font-size: 27px; line-height: 1.3; margin-bottom: 8px; }
.ob-sub { font-size: 12.5px; color: var(--ink-2); line-height: 1.8; margin-bottom: 22px; }
.ob-note { margin-top: 18px; font-size: 10.5px; color: var(--ink-3); line-height: 1.75; }
.ob-goal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.goal-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); text-align: left; transition: .16s; }
.goal-card.on { border-color: var(--green); background: var(--green-soft); }
.goal-card .t { font-family: var(--serif); font-size: 15px; }
.goal-card .s { font-size: 10px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
.result-box { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.result-item .k { font-size: 10px; color: var(--ink-3); }
.result-item .v { font-family: var(--serif); font-size: 25px; margin-top: 2px; }
.result-item .v small { font-size: 10px; font-family: var(--sans); color: var(--ink-3); }
.result-note { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--ink-3); line-height: 1.8; }
.ob-actions { display: flex; gap: 9px; margin-top: 22px; }
.ob-actions .btn-primary { flex: 1; }
.demo-link { display: block; margin: 16px auto 0; font-size: 11px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 杂项 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 88px; transform: translate(-50%, 8px);
  background: var(--ink); color: var(--paper);
  padding: 9px 16px; border-radius: 20px; font-size: 12px; z-index: 120;

.coach-msg.pending { color: var(--ink-3); font-style: italic; }
.coach-empty { padding: 12px 0; color: var(--ink-3); font-size: 12.5px; text-align: center; }
.coach-input { display: flex; gap: 8px; align-items: flex-end; }
.coach-input textarea { flex: 1; resize: none; min-height: 48px; max-height: 110px; }
.coach-send {
  flex-shrink: 0; height: 44px; padding: 0 16px; border-radius: 12px;
  background: var(--green); color: #F7F5EC; font-size: 13px;
}
.coach-send:disabled { opacity: .5; }
.coach-hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin-top: 8px; }

/* ---------- v3.1 · PIN 锁 ---------- */
.lock-overlay {
  position: fixed; inset: 0; z-index: 130;
  display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(700px 500px at 50% 18%, rgba(255, 253, 245, .94), transparent 70%),
    var(--paper);
}
[data-theme="dark"] .lock-overlay {
  background:
    radial-gradient(700px 500px at 50% 18%, rgba(26, 33, 29, .96), transparent 70%),
    var(--paper);
}
.lock-box { width: 100%; max-width: 320px; text-align: center; }
.lock-mark {
  width: 52px; height: 52px; border-radius: 16px; margin: 0 auto 14px;
  background: var(--green); color: #F7F5EC;
  display: grid; place-items: center;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12);
}
.lock-mark svg { width: 24px; height: 24px; }
.lock-title { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.lock-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 5px; line-height: 1.6; }
.lock-input {
  width: 100%; margin-top: 18px; text-align: center;
  letter-spacing: .35em; font-size: 20px; padding: 12px;
  border-radius: 12px; border: 1px solid var(--line-2); background: var(--field);
}
.lock-input:focus { outline: none; border-color: var(--green-line); }
.lock-err { min-height: 18px; font-size: 12px; color: var(--red); margin-top: 6px; }
.lock-box.shake { animation: lock-shake .32s; }
@keyframes lock-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-3px); }
}

/* ---------- v3.1 · 安全护栏 ---------- */
.guard-card { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.guard-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 13px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.guard-item.red { border-color: rgba(166, 74, 60, .35); background: var(--red-soft); }
.guard-item.amber { border-color: rgba(177, 119, 59, .35); background: var(--amber-soft); }
.guard-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--amber); }
.guard-item.red .guard-dot { background: var(--red); }
.guard-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.guard-main .t { font-size: 13px; font-weight: 600; }
.guard-main .s { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; }
.guard-act { flex-shrink: 0; align-self: center; color: var(--green); }
.coach-retry { display: block; margin-top: 6px; font-size: 11.5px; color: var(--green); text-decoration: underline; }

/* ============================================================
   v3.2 · 力量 PR / 菜谱 / 周报 / 可穿戴 / 进度照片
   ============================================================ */
.row-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.tiny-value { font-size: 11px !important; line-height: 1.5; }
.recipe-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.recipe-card { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; transition: .16s; }
.recipe-card:hover { border-color: var(--green-line); background: var(--green-soft); }
.recipe-card .n { font-size: 13px; font-weight: 600; color: var(--ink); }
.recipe-card .k { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.recipe-card .add { font-size: 10.5px; color: var(--green); margin-top: 7px; }
.shop-teaser { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.recipe-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recipe-row .rm { flex: 1; min-width: 0; }
.recipe-row .n { font-size: 13.5px; font-weight: 600; }
.recipe-row .k { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.55; }
.recipe-row .ra { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.shop-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.shop-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.shop-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.shop-row.on { background: var(--green-soft); border-color: var(--green-line); }
.shop-row .box { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; color: var(--green); }
.shop-row.on .box { background: var(--green); border-color: var(--green); color: #fff; }
.shop-row .box svg { width: 11px; height: 11px; }
.shop-row .n { flex: 1; font-size: 13px; }
.shop-row.on .n { text-decoration: line-through; color: var(--ink-3); }
.shop-row .q { font-family: var(--serif); font-size: 15px; color: var(--ink-2); }
.week-entry { display: block; }
.week-actions { display: flex; gap: 6px; }
.week-preview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.week-preview img { display: block; width: 100%; height: auto; }
.pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.pr-item { border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); padding: 10px 12px; }
.pr-item .k { font-size: 11px; color: var(--ink-3); }
.pr-item .v { font-family: var(--serif); font-size: 24px; color: var(--green-deep); margin-top: 2px; }
.pr-item .v small { font-size: 11px; color: var(--ink-2); margin-left: 3px; }
.pr-item .s { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.lift-recent { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
.lift-row { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 5px 0; color: var(--ink-2); }
.lift-row .d { width: 38px; color: var(--ink-3); flex: none; }
.lift-row .n { flex: 1; color: var(--ink); }
.lift-row .v { font-family: var(--serif); color: var(--ink-2); }
.photo-mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.photo-thumb { padding: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); aspect-ratio: 1; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-stats { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; }
.ps-item { border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); padding: 10px; min-width: 0; }
.ps-item .v { font-family: var(--serif); font-size: 20px; color: var(--green-deep); word-break: break-word; }
.ps-item .k { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.photo-date { margin-top: 16px; }
.pd-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.photo-cell { position: relative; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--surface-2); }
.photo-cell img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; }
.pc-meta { font-size: 9.5px; color: var(--ink-3); padding: 5px 8px; }
.pc-del { position: absolute; top: 6px; right: 6px; background: rgba(251,249,242,.9); border-color: var(--line); }
.import-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.is-item { border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); padding: 10px; text-align: center; }
.is-item .v { font-family: var(--serif); font-size: 19px; color: var(--green-deep); }
.is-item .k { font-size: 9.5px; color: var(--ink-3); margin-top: 2px; }
.import-note { font-size: 11px; color: var(--ink-2); line-height: 1.75; margin: 14px 0 10px; }
.import-list { display: flex; flex-direction: column; gap: 6px; }
.import-row { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface); }
.import-row.conflict { border-color: rgba(177,119,59,.45); background: var(--amber-soft); }
.im-date { font-size: 11.5px; font-weight: 600; }
.im-vals { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 10.5px; color: var(--ink-2); margin-top: 3px; }
.im-conf { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.im-conf label { font-size: 10.5px; color: var(--amber); display: flex; gap: 4px; align-items: center; }
.im-conf input { accent-color: var(--amber); }
.preview-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.preview-line b { font-family: var(--serif); font-size: 22px; color: var(--green-deep); }
@media (max-width: 620px) {
  .photo-grid { grid-template-columns: 1fr 1fr; }
  .import-sum { grid-template-columns: 1fr 1fr; }
  .photo-stats { grid-template-columns: 1fr 1fr; }
  .ps-item:last-child { grid-column: span 2; }
  .recipe-row { flex-wrap: wrap; }
  .recipe-row .ra { width: 100%; justify-content: flex-end; }
}

<script>
/* assets/data.js */
/* 能量账本 · 内置数据
   食物营养值均为「每 100 克可食部」的近似值，参考中国食物成分表与常见营养标签。
   单位为：kcal / 蛋白质 g / 碳水 g / 脂肪 g / 膳食纤维 g。
   格式：[名称, 分类索引, 热量, 蛋白, 碳水, 脂肪, 纤维, 一份克数, 份量名, 别名]

<script>
/* assets/engine.js */
/* 能量账本 · 计算引擎
   纯函数，不依赖 DOM 与存储，便于单独验证。
   核心：自适应 TDEE（用你自己的体重与摄入反推真实消耗）、区间估算、下一餐决策。
*/
(function (global) {
  'use strict';

  const DATA = global.LEDGER_DATA;
  const KCAL_PER_KG = 7700;
  const WINDOW = 28;

  /* ---------------- 日期 ---------------- */
  const pad = n => (n < 10 ? '0' + n : '' + n);
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateOf(key) { const p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function todayKey() { return keyOf(new Date()); }
  function addDays(key, delta) {
    const p = key.split('-').map(Number);
    return keyOf(new Date(p[0], p[1] - 1, p[2] + delta));
  }
  function rangeKeys(endKey, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(addDays(endKey, -i));
    return out;
  }
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function weekday(key) { return WEEK[dateOf(key).getDay()]; }
  function isWeekend(key) { const w = dateOf(key).getDay(); return w === 0 || w === 6; }
  function dateLabel(key) {
    const p = key.split('-').map(Number);
    return p[1] + '月' + p[2] + '日';
  }
  function fullLabel(key) { return dateLabel(key) + ' · 周' + weekday(key); }
  function shortLabel(key) { const p = key.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function daysBetween(a, b) { return Math.round((dateOf(b) - dateOf(a)) / 86400000); }
  function relativeDay(key, today) {
    if (key === today) return '今天';
    if (key === addDays(today, -1)) return '昨天';
    if (key === addDays(today, 1)) return '明天';
    return dateLabel(key);
  }

  /* ---------------- 食物库 ---------------- */
  const CATS = DATA.categories;
  const FOODS = DATA.foods.map((r, i) => ({
    id: 'f' + i,
    name: r[0],
    cat: r[1],
    catName: CATS[r[1]],
    kcal: r[2],
    p: r[3],
    c: r[4],
    f: r[5],
    fib: r[6],
    unitG: r[7] || 0,
    unit: r[8] || '',
    aliases: r[9] ? r[9].split('|') : [],
    custom: false
  }));

  const EXERCISES = DATA.exercises.map((r, i) => ({ id: 'e' + i, name: r[0], mets: r[1] }));
  const MEALS = DATA.meals;
  const ACTIVITIES = DATA.activities;

  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
  function searchFoods(keyword, foods) {
    const pool = foods || FOODS;
    const q = norm(keyword);
    if (!q) return pool.slice(0, 40);
    const scored = [];
    pool.forEach(f => {
      let score = 0;
      const n = norm(f.name);
      if (n === q) score = 100;
      else if (n.indexOf(q) === 0) score = 80;
      else if (n.indexOf(q) > -1) score = 55;
      else if (f.aliases.some(a => norm(a).indexOf(q) > -1)) score = 45;
      else if (norm(f.catName).indexOf(q) > -1) score = 20;
      if (score) scored.push({ f, score });
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 40).map(x => x.f);
  }
  function foodByName(name, foods) {
    const q = norm(name);
    const pool = foods || FOODS;
    return pool.find(f => norm(f.name) === q) ||
      pool.find(f => f.aliases.some(a => norm(a) === q)) ||
      pool.find(f => norm(f.name).replace(/（.*?）/g, '') === q) || null;
  }
  function mealLabel(key) { const m = MEALS.find(x => x[0] === key); return m ? m[1] : '一餐'; }
  function guessMeal(now) {
    const h = (now || new Date()).getHours();
    if (h < 10) return 'breakfast';
    if (h < 15) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  /* ---------------- 目标 ---------------- */
  function targets(p, weightKg) {
    if (!p || !p.sex || !p.age || !p.height) return null;
    const w = Number(weightKg || p.weight || 65);
    const height = Number(p.height), age = Number(p.age);
    const base = 10 * w + 6.25 * height - 5 * age;
    const bmr = Math.round(p.sex === 'male' ? base + 5 : base - 161);
    const activity = ACTIVITIES.find(a => a[0] === p.activity) || ACTIVITIES[1];
    const priorTDEE = Math.round(bmr * activity[3]);
    const rate = Number(p.rate || 0.5);
    const goal = p.goal || 'lose';
    let deficit;
    if (goal === 'lose') deficit = Math.min(rate * KCAL_PER_KG / 7, priorTDEE * 0.22);
    else if (goal === 'gain') deficit = -Math.min(rate * KCAL_PER_KG / 7, priorTDEE * 0.15);
    else deficit = 0;
    deficit = Math.round(deficit);
    const floor = p.sex === 'male'
      ? Math.max(1500, Math.round(bmr * 0.92))
      : Math.max(1200, Math.round(bmr * 0.92));
    let budget = priorTDEE - deficit;
    if (budget < floor) { budget = floor; deficit = priorTDEE - budget; }
    const proteinPerKg = Number(p.proteinFactor) || (goal === 'lose' ? 1.6 : goal === 'gain' ? 1.8 : 1.4);
    return {
      bmr,
      priorTDEE,
      activity: activity[1],
      activityFactor: activity[3],
      deficit,
      floor,
      budgetPrior: Math.round(budget / 10) * 10,
      protein: Math.round(w * proteinPerKg),
      proteinPerKg,
      fiber: p.sex === 'male' ? 30 : 25,
      water: Math.round(w * 35 / 50) * 50,
      rate,
      goal,
      weight: w,
      capped: goal === 'lose' && rate * KCAL_PER_KG / 7 > priorTDEE * 0.22
    };
  }

  function budgetFor(tdee, tgt) {
    if (!tgt) return tdee;
    return Math.max(tgt.floor, Math.round((tdee - tgt.deficit) / 10) * 10);
  }

  /* ---------------- 线性回归 ---------------- */
  function regress(points) {
    const n = points.length;
    if (n < 2) return null;
    let mx = 0, my = 0;
    points.forEach(p => { mx += p.x; my += p.y; });
    mx /= n; my /= n;
    let sxx = 0, sxy = 0, syy = 0;
    points.forEach(p => {
      const dx = p.x - mx, dy = p.y - my;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    });
    if (!sxx) return null;
    const slope = sxy / sxx;
    const intercept = my - slope * mx;
    const ssr = Math.max(0, syy - slope * sxy);
    const se = n > 2 ? Math.sqrt((ssr / (n - 2)) / sxx) : 0;
    return { slope, intercept, n, se, mx, my };
  }

  /* ---------------- 体重趋势（EMA） ---------------- */
  function weightMap(weights) {
    const map = {};
    (weights || []).forEach(w => {
      const kg = Number(w.kg != null ? w.kg : w.weight);
      if (!isFinite(kg) || kg <= 0) return;
      const k = w.date || w.dateKey;
      map[k] = kg;
    });
    return map;
  }

  function trendSeries(weights, startKey, endKey) {
    const map = weightMap(weights);
    const keys = Object.keys(map).sort();
    if (!keys.length) return [];
    const out = [];
    let tw = null;
    const begin = addDays(startKey, -14);
    for (let k = begin; k <= endKey; k = addDays(k, 1)) {
      if (map[k] != null) {
        tw = tw == null ? map[k] : tw + 0.22 * (map[k] - tw);
        out.push({ date: k, tw: tw, raw: map[k] });
      } else if (tw != null && k >= startKey) {
        out.push({ date: k, tw: tw, raw: null });
      }
    }
    return out;
  }

  function latestWeight(weights, profile) {
    const map = weightMap(weights);
    const keys = Object.keys(map).sort();
    if (keys.length) {
      const k = keys[keys.length - 1];
      return { kg: map[k], date: k };
    }
    return profile && profile.weight ? { kg: Number(profile.weight), date: null } : null;
  }

  /* ---------------- 自适应 TDEE ---------------- */
  function adaptive(entries, weights, profile, tgt, today) {
    const todayK = today || todayKey();
    const end = addDays(todayK, -1);
    const start = addDays(end, -(WINDOW - 1));
    const intakeMap = {};
    (entries || []).forEach(e => {
      const k = e.date || e.dateKey;
      if (k < start || k > end) return;
      intakeMap[k] = (intakeMap[k] || 0) + Math.max(0, Number(e.kcal) || 0);
    });
    const keys = rangeKeys(end, WINDOW);
    const validDays = keys.filter(k => intakeMap[k] >= 500);
    const meanIntake = validDays.length
      ? validDays.reduce((s, k) => s + intakeMap[k], 0) / validDays.length : 0;

    const wmap = weightMap(weights);
    const wpoints = Object.keys(wmap).filter(k => k >= addDays(start, -7) && k <= end)
      .sort().map(k => ({ x: daysBetween(start, k), y: wmap[k], key: k }));
    const reg = wpoints.length >= 4 ? regress(wpoints) : null;
    const span = wpoints.length ? daysBetween(wpoints[0].key, wpoints[wpoints.length - 1].key) : 0;

    let observed = null, w = 0, band = Math.round(tgt.priorTDEE * 0.12), status = 'prior';
    const enough = validDays.length >= 8 && wpoints.length >= 5 && span >= 12 && reg;
    if (enough) {
      observed = meanIntake - reg.slope * KCAL_PER_KG;
      const evidence = Math.min(validDays.length, Math.max(wpoints.length * 1.5, 8));
      w = Math.min(0.92, Math.max(0, evidence / 26));
      if (observed < tgt.priorTDEE * 0.72 || observed > tgt.priorTDEE * 1.4) {
        w = Math.min(w, 0.3);
      }
      observed = Math.max(tgt.priorTDEE * 0.72, Math.min(tgt.priorTDEE * 1.4, observed));
      band = Math.max(80, Math.min(900, Math.round(reg.se * 1.64 * KCAL_PER_KG)));
      status = w >= 0.55 ? 'calibrated' : 'calibrating';
    }
    const tdee = enough ? Math.round(observed * w + tgt.priorTDEE * (1 - w)) : tgt.priorTDEE;
    const evidenceDays = Math.min(validDays.length, Math.max(wpoints.length * 2, 0));
    const daysNeeded = Math.max(0, Math.min(18, 22 - evidenceDays));

    // 预测用斜率：最近 28 天全部体重点
    const recent = Object.keys(wmap).filter(k => k >= addDays(end, -27) && k <= end)
      .sort().map(k => ({ x: daysBetween(start, k), y: wmap[k], key: k }));
    const regRecent = recent.length >= 4 ? regress(recent) : reg;
    const latest = latestWeight(weights, profile);
    const series = trendSeries(weights, start, end);
    const trendNow = series.length ? series[series.length - 1].tw : (latest ? latest.kg : null);

    return {
      prior: tgt.priorTDEE,
      observed: observed == null ? null : Math.round(observed),
      tdee,
      band,
      weight: w,
      percent: Math.round(w * 100),
      status,
      validDays: validDays.length,
      weightDays: wpoints.length,
      spanDays: span,
      meanIntake: Math.round(meanIntake),
      daysNeeded,
      slope: regRecent && regRecent.slope ? regRecent.slope : 0,
      trendWeight: trendNow == null ? null : Math.round(trendNow * 10) / 10,
      budget: budgetFor(tdee, tgt),
      windowStart: start,
      windowEnd: end
    };
  }

  /* ---------------- 单日汇总与区间 ---------------- */
  const ERR = { high: 0.06, med: 0.16, low: 0.3 };
  function confOf(e) {
    if (e.conf) return e.conf;
    if (e.source === 'ai') return 'low';
    if (e.source === 'lib' || e.source === 'combo') return 'high';
    return 'med';
  }
  function summary(entries, dateKey) {
    const list = (entries || []).filter(e => (e.date || e.dateKey) === dateKey);
    const s = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, low: 0, high: 0, count: list.length, items: list, byMeal: {} };
    MEALS.forEach(m => { s.byMeal[m[0]] = { kcal: 0, p: 0, c: 0, f: 0, fib: 0, items: [], low: 0, high: 0 }; });
    list.forEach(e => {
      const kcal = Math.max(0, Number(e.kcal) || 0);
      const err = ERR[confOf(e)] != null ? ERR[confOf(e)] : 0.16;
      s.kcal += kcal;
      s.p += Number(e.p) || 0;
      s.c += Number(e.c) || 0;
      s.f += Number(e.f) || 0;
      s.fib += Number(e.fib) || 0;
      s.low += kcal * (1 - err);
      s.high += kcal * (1 + err);
      const m = s.byMeal[e.meal] || s.byMeal.snack;
      m.kcal += kcal;
      m.p += Number(e.p) || 0;
      m.c += Number(e.c) || 0;
      m.f += Number(e.f) || 0;
      m.fib += Number(e.fib) || 0;
      m.items.push(e);
      m.low += kcal * (1 - err);
      m.high += kcal * (1 + err);
    });
    s.low = Math.round(s.low);
    s.high = Math.round(s.high);
    s.kcal = Math.round(s.kcal);
    s.p = Math.round(s.p);
    s.c = Math.round(s.c);
    s.f = Math.round(s.f);
    s.fib = Math.round(s.fib);
    Object.keys(s.byMeal).forEach(k => {
      const m = s.byMeal[k];
      m.kcal = Math.round(m.kcal); m.p = Math.round(m.p); m.fib = Math.round(m.fib);
      m.low = Math.round(m.low); m.high = Math.round(m.high);
    });
    return s;
  }

  function burnedByDate(exercises, dateKey) {
    return (exercises || []).filter(x => (x.date || x.dateKey) === dateKey)
      .reduce((s, x) => s + Math.max(0, Number(x.kcal) || 0), 0);
  }

  function entryKcal(e, grams) {
    if (grams != null && e.per100 > 0) return Math.round(e.per100 * grams / 100);
    return Math.round(Number(e.kcal) || 0);
  }

  function streak(entries, today) {
    const days = new Set((entries || []).map(e => e.date || e.dateKey));
    let k = days.has(today) ? today : addDays(today, -1);
    if (!days.has(k)) return 0;
    let n = 0;
    while (days.has(k) && n < 999) { n++; k = addDays(k, -1); }
    return n;
  }

  /* ---------------- 预测 ---------------- */
  function forecast(weights, targetKg, today, windowDays) {
    const end = today || todayKey();
    const start = addDays(end, -(windowDays || 28) + 1);
    const map = weightMap(weights);
    const pts = Object.keys(map).filter(k => k >= start && k <= end).sort()
      .map(k => ({ x: daysBetween(start, k), y: map[k], key: k }));
    if (pts.length < 4 || daysBetween(pts[0].key, pts[pts.length - 1].key) < 10) return null;
    const reg = regress(pts);
    if (!reg) return null;
    const series = trendSeries(weights, start, end);
    const now = series.length ? series[series.length - 1].tw : pts[pts.length - 1].y;
    const weekly = reg.slope * 7;
    const fourWeek = now + reg.slope * 28;
    let etaDays = null;
    if (targetKg && Math.abs(targetKg - now) > 1 && Math.abs(reg.slope) > 0.002) {
      const toward = (targetKg - now) * reg.slope > 0;
      if (toward) etaDays = Math.round((targetKg - now) / reg.slope);
    }
    return {
      now: Math.round(now * 10) / 10,
      weekly: Math.round(weekly * 100) / 100,
      fourWeek: Math.round(fourWeek * 10) / 10,
      etaDays,
      slope: reg.slope,
      points: pts.length,
      start: start
    };
  }

  /* ---------------- 洞察 ---------------- */
  function insights(entries, weights, profile, tgt, ad, today, days) {
    const n = days || 14;
    const end = today || todayKey();
    const keys = rangeKeys(end, n);
    const daily = keys.map(k => {
      const s = summary(entries, k);
      return { date: k, kcal: s.kcal, p: s.p, fib: s.fib, logged: s.count > 0 };
    });
    const logged = daily.filter(d => d.logged);
    const avgIntake = logged.length ? Math.round(logged.reduce((s, d) => s + d.kcal, 0) / logged.length) : 0;
    const within = daily.filter(d => d.logged && d.kcal <= ad.budget * 1.03).length;
    const proteinHit = daily.filter(d => d.logged && d.p >= tgt.protein * 0.9).length;
    const avgProtein = logged.length ? Math.round(logged.reduce((s, d) => s + d.p, 0) / logged.length) : 0;
    const avgFiber = logged.length ? Math.round(logged.reduce((s, d) => s + d.fib, 0) / logged.length) : 0;

    const series = trendSeries(weights, keys[0], end);
    let delta = null;
    if (series.length > 3) delta = Math.round((series[series.length - 1].tw - series[0].tw) * 10) / 10;

    const wk = daily.filter(d => d.logged && !isWeekend(d.date));
    const we = daily.filter(d => d.logged && isWeekend(d.date));
    const wkAvg = wk.length ? Math.round(wk.reduce((s, d) => s + d.kcal, 0) / wk.length) : 0;
    const weAvg = we.length ? Math.round(we.reduce((s, d) => s + d.kcal, 0) / we.length) : 0;

    const coverage = Math.round(logged.length / n * 100);
    const narrative = [];
    if (logged.length < 4) {
      narrative.push('这段时间只记录了 ' + logged.length + ' 天，账本还不足以判断趋势。先把「记一天」变成习惯，校准会更快。');
    } else {
      narrative.push('过去 ' + n + ' 天你记账 ' + logged.length + ' 天，平均摄入 ' + avgIntake.toLocaleString() + ' kcal，'
        + (avgIntake <= ad.budget ? '比预算低 ' + (ad.budget - avgIntake) + ' kcal。' : '比预算高 ' + (avgIntake - ad.budget) + ' kcal。'));
      if (delta != null) {
        narrative.push('体重趋势' + (delta === 0 ? '基本持平' : (delta > 0 ? '上升 ' : '下降 ') + Math.abs(delta) + ' kg') + '。'
          + (ad.status === 'calibrated' ? '按 7,700 kcal/kg 反推，你的真实消耗约为 ' + ad.tdee + ' kcal/天，比公式估计'
            + (ad.tdee >= ad.prior ? '高 ' : '低 ') + Math.abs(ad.tdee - ad.prior) + ' kcal。' : '足够的体重与摄入记录之后，这里会给出你的真实消耗。'));
      }
      if (logged.length >= 5) {
        narrative.push('蛋白质平均 ' + avgProtein + ' g，达标 ' + proteinHit + ' 天；膳食纤维平均 ' + avgFiber + ' g。'
          + (avgProtein < tgt.protein * 0.85 ? '蛋白质是当前最值得补的一项。' : '蛋白质完成得不错。'));
      }
      if (wk.length >= 2 && we.length >= 2 && Math.abs(weAvg - wkAvg) > 80) {
        narrative.push('周末平均 ' + weAvg + ' kcal，工作日 ' + wkAvg + ' kcal，相差 ' + Math.abs(weAvg - wkAvg) + ' kcal——这是最明显的波动来源。');
      }
    }
    return {
      days: n, loggedDays: logged.length, coverage, avgIntake, within, proteinHit,
      avgProtein, avgFiber, delta, weekdayAvg: wkAvg, weekendAvg: weAvg,
      narrative, daily, budget: ad.budget
    };
  }

  /* ---------------- 下一餐 ---------------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function r5(v) { return Math.round(v / 5) * 5; }

  function nextBite(opts) {
    const foods = opts.foods || FOODS;
    const remaining = Math.round(opts.remaining || 0);
    const gap = Math.max(0, Math.round(opts.proteinGap || 0));
    const meal = opts.meal || guessMeal();
    const seed = opts.seed || 0;

    if (remaining <= 0) {
      return { type: 'over', items: [], totals: { kcal: 0, p: 0 }, text: '今天已经超出预算。下一顿以蔬菜和蛋白质为主，主食减半就好。' };
    }
    if (remaining <= 140) {
      return { type: 'done', items: [], totals: { kcal: 0, p: 0 }, text: '预算基本用完。如果还饿，喝水或无糖茶，等下一餐。' };
    }

      item.c = Math.round(item.c100 * item.grams / 100 * 10) / 10;
      item.f = Math.round(item.f100 * item.grams / 100 * 10) / 10;
      item.fib = Math.round(item.fib100 * item.grams / 100 * 10) / 10;

      const cut = Math.min(15, item.grams - 40);
      const oldKcal = item.kcal;
      item.grams -= cut;
      item.kcal = Math.round(item.per100 * item.grams / 100);
      item.p = Math.round(item.p100 * item.grams / 100 * 10) / 10;
      item.c = Math.round(item.c100 * item.grams / 100 * 10) / 10;
      item.f = Math.round(item.f100 * item.grams / 100 * 10) / 10;
      item.fib = Math.round(item.fib100 * item.grams / 100 * 10) / 10;
      used -= oldKcal - item.kcal;
    }

    const totalKcal = items.reduce((s, x) => s + x.kcal, 0);
    const totalP = Math.round(items.reduce((s, x) => s + x.p, 0) * 10) / 10;
    const pct = Math.round(totalKcal / Math.max(1, remaining) * 100);

    if (gap > 15) text = '蛋白质还差 ' + gap + ' g，这一组能补 ' + totalP + ' g，约占今日剩余的 ' + pct + '%。';

      text, mealBudget, remaining, proteinGap: gap
    };
