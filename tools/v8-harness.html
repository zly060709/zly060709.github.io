<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能量账本 v6.0 · 全池双主题测试台 390×844（开发工具，不影响线上）</title>
<style>
  body{margin:0;font:13px/1.6 system-ui,sans-serif;background:#1c1f22;color:#dfe5e8;display:flex;gap:14px;padding:14px}
  #phone{width:390px;height:844px;border:0;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#fff;flex:0 0 auto}
  .side{flex:1;min-width:0}
  button{margin:2px;padding:4px 10px;background:#2d3338;color:#dfe5e8;border:1px solid #454c52;border-radius:6px;cursor:pointer;font-size:12px}
  button.on{background:#2C6B51;border-color:#3d8a6b}
  #out{white-space:pre-wrap;font:11px/1.5 Consolas,monospace;background:#111417;border:1px solid #333;padding:10px;height:62vh;overflow:auto;border-radius:8px}
  h3{margin:8px 0 4px;font-size:13px}
  .row{max-height:150px;overflow:auto}
</style>
</head>
<body>
<iframe id="phone" src="../index.html"></iframe>
<div class="side">
  <h3>批量审计（390×844 真实视口 · 明暗双主题 350 跑次）</h3>
  <button onclick="batchPool()">全池 175 身份 × {亮,暗}</button>
  <button onclick="batchPool('light')">仅亮色</button>
  <button onclick="batchPool('dark')">仅暗色</button>
  <button onclick="batchNew()">仅新 50（g86–g135）</button>
  <button onclick="stopBatch()">停止</button>
  <h3>逻辑探针（v6.1 并入自 v5.6 验证轮）</h3>
  <button onclick="runLogic()">运行逻辑探针</button>
  <h3>单套操作</h3>
  <div class="row" id="skinBtns"></div>
  <h3>操作</h3>
  <button onclick="act('reload')">重载</button>
  <button onclick="act('addentry')">记一笔(+5天历史)</button>
  <button onclick="act('clear')">清空记录</button>
  <button onclick="act('dark')">明/暗</button>
  <button onclick="act('over')">造超支(大餐)</button>
  <h3>交互探针</h3>
  <button onclick="probe('tap')">tap 单元</button>
  <button onclick="probe('swipe')">swipe 翻视图</button>
  <button onclick="probe('flick')">flick 冲量</button>
  <button onclick="probe('open')">open 容器</button>
  <h3>输出</h3>
  <div id="out">ready</div>
</div>
<script>
/* v6.0 全池枚举：不再抽样——175 个 data-skin 身份全测（v7-harness 76/101 的修正） */
const V7=[];for(let i=36;i<=135;i++)V7.push('g'+i);
const V6=['g26','g27','g28','g29','g30','g31','g32','g33','g34','g35'];
const GEN=[];for(let i=1;i<=25;i++)GEN.push('g'+(i<10?'0'+i:i));
const ART=['a-sakura','a-galaxy','a-neon','a-wuxia','a-fireworks','a-aurora','a-chart','a-chrome','a-culture','a-glass','a-polar','a-pulse','a-radio','a-tidal','a-type'];
const LOCAL=['paper','kraft','green','pen','sakura','mint','indigo','coffee','gold','almanac','greyblue','linen','pom','olive','lavender','ochre','glacier','pomelo','bamboo','midnight','rosegold','cedar','sky','oldnews','porcelain'];
const ALL=V7.concat(V6,GEN,ART,LOCAL);
const btns=document.getElementById('skinBtns');
ALL.forEach(id=>{const b=document.createElement('button');b.textContent=id;b.dataset.id=id;b.onclick=()=>setSkin(id);btns.appendChild(b);});
const frame=document.getElementById('phone');
const out=(...a)=>{const o=document.getElementById('out');o.textContent+='\n'+a.join(' ');o.scrollTop=o.scrollHeight;};
const W=()=>frame.contentWindow;
function mark(id){btns.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));}
function db(){try{return JSON.parse(W().localStorage.getItem('energy-ledger.v2')||'{}')}catch(e){return {}}}
function saveDb(d){W().localStorage.setItem('energy-ledger.v2',JSON.stringify(d))}
function setSkin(id,theme){
  const d=db();
  d.settings=Object.assign({theme:theme||'light',fx:true,powerSave:false,mode:'full'},d.settings||{},{mode:'full',theme:theme||d.settings&&d.settings.theme||'light'});
  d.skins=Object.assign({},d.skins,{active:id,unlocked:ALL.slice()});
  d.profile=d.profile||{sex:'male',age:30,height:172,weight:65,targetWeight:60,activity:'moderate',goal:'lose',rate:.5,proteinFactor:1.6,createdAt:Date.now()};
  d.weights=d.weights&&d.weights.length?d.weights:[{date:todayKey(),kg:65}];
  d.onboarded=true;
  saveDb(d);mark(id);
  frame.src='../index.html?skin='+id+'&t='+Date.now();
}
function todayKey(){const t=new Date();const p=n=>String(n).padStart(2,'0');return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());}
function dstr(off){const x=new Date();x.setDate(x.getDate()-off);const p=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());}
function addEntry(kcal,name,over){
  const d=db();d.entries=d.entries||[];
  for(let i=1;i<=6;i++){
    if(!d.entries.some(e=>e.date===dstr(i)&&e.id==='h'+i))
      d.entries.push({id:'h'+i,date:dstr(i),meal:'lunch',name:'历史'+i,grams:100,per100:{kcal:120,p:6,c:15,f:4,fib:1},cat:'测试',kcal:380+i,p:8,c:30,f:8,fib:1,conf:'high',source:'manual',createdAt:Date.now()-i*864e5});
  }
  d.entries.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),date:todayKey(),meal:'lunch',name:name||'测试餐',grams:200,per100:{kcal:150,p:8,c:20,f:5,fib:1},cat:'测试',kcal:kcal||(over?2200:480),p:16,c:40,f:10,fib:2,conf:'high',source:'manual',createdAt:Date.now()});
  saveDb(d);
}
window.act=async function(op){
  if(op==='reload'){frame.src=frame.src;return;}
  if(op==='addentry'){addEntry();frame.src=frame.src;out('[i] 已记一笔+6天历史');return;}
  if(op==='over'){addEntry(2200,'超支大餐');frame.src=frame.src;out('[i] 已造超支');return;}
  if(op==='clear'){const d=db();d.entries=[];saveDb(d);frame.src=frame.src;out('[i] 已清空');return;}
  if(op==='dark'){const d=db();d.settings.theme=(d.settings.theme==='dark'?'light':'dark');saveDb(d);frame.src=frame.src;out('[i] 主题',d.settings.theme);return;}
};
window.probe=async function(op){
  const W2=W(),D=W2.document;
  const box=D.getElementById('skinStage');if(!box){out('[probe] no stage');return;}
  const r=box.getBoundingClientRect();
  const mk=(type,x,y)=>new W2.PointerEvent(type,{bubbles:true,clientX:x,clientY:y,pointerId:7,isPrimary:true});
  if(op==='tap'){
    const t=box.querySelector('.gu, .vs-it, .ty-cell, .mt-wrap');
    if(!t){out('[tap] no target');return;}
    const tr=t.getBoundingClientRect();
    t.dispatchEvent(mk('pointerdown',tr.left+10,tr.top+10));
    t.dispatchEvent(mk('pointerup',tr.left+10,tr.top+10));
    t.click&&t.click();
    out('[tap] target=',t.className,'| tip=',(box.querySelector('.gv-tip')||box.querySelector('.mt-badge')||{}).textContent||'(none)');
  } else if(op==='swipe'){
    box.dispatchEvent(mk('pointerdown',r.left+r.width/2,r.top+40));
    box.dispatchEvent(mk('pointerup',r.left+r.width/2-90,r.top+40));
    out('[swipe] dots=',[...box.querySelectorAll('.pl-dots i')].map(i=>i.className).join(','),'| state=',JSON.stringify(W2.SkinV7&&W2.SkinV7.state()));
  } else if(op==='flick'){
    box.dispatchEvent(mk('pointerdown',r.left+60,r.top+40));
    box.dispatchEvent(mk('pointerup',r.left+160,r.top+40));
    out('[flick] class=',box.className);
    setTimeout(()=>out('[flick] after2.4s class=',box.className),2500);
  } else if(op==='open'){
    box.dispatchEvent(mk('pointerdown',r.left+r.width/2,r.top+60));
    box.dispatchEvent(mk('pointerup',r.left+r.width/2,r.top+60));
    box.click&&box.click();
    out('[open] class=',box.className);
  }
};
/* ---------- 批量审计（v6.0：+ 双主题 + 徽记/指示/DOM 预算断言） ---------- */
let batchStop=false;
function stopBatch(){batchStop=true;out('[batch] 停止标记');}
function getBadge(W2){
  const t=W2.document.querySelector('.page-head .page-title');
  if(!t)return '(no-title)';
  const cs=W2.getComputedStyle(t,'::after');
  return cs.content||'(none)';
}
function getTabIndicator(W2){
  const on=W2.document.querySelector('.tabbar button.on');
  if(!on)return -1;
  const cs=W2.getComputedStyle(on,'::before');
  const w=parseFloat(cs.width)||0,h=parseFloat(cs.height)||0;
  return Math.max(w,h);
}
async function batchList(ids,theme){
  batchStop=false;
  const pass=[],fail=[];
  for(const id of ids){
    if(batchStop){out('[batch] 手动停止 @',id);break;}
    await new Promise(res=>{frame.onload=res;setSkin(id,theme);});
    await new Promise(async r=>{
      const t0=Date.now();
      const mech=V7.indexOf(id)>=0||V6.indexOf(id)>=0;
      while(Date.now()-t0<2600){
        await new Promise(z=>setTimeout(z,90));
        try{
          const W2=frame.contentWindow,X=W2.document.documentElement;
          const sk=X.getAttribute('data-skin');
          const box=W2.document.getElementById('skinStage');
          const mounted=!!box&&box.offsetHeight>0;
          if(sk===id&&(!mech||mounted))break;
          if(sk==='paper'&&Date.now()-t0>1200)break;
        }catch(e){}
      }
      r();
    });
    const W2=W(),X=W2.document.documentElement;
    const errs=(W2.__v7Errors||[]);
    let a=null,gen=null;
    try{a=W2.SkinV7?W2.SkinV7.audit():null;}catch(e){errs.push('audit:'+e);}
    try{gen=W2.SkinGen?W2.SkinGen.audit():null;}catch(e){}
    const doc=W2.document;
    await new Promise(z=>setTimeout(z,250));
    const vw=W2.innerWidth;
    const overflowX=[...doc.querySelectorAll('body *')].some(el=>{
      const st=W2.getComputedStyle(el);
      if(st.position==='fixed'||st.display==='none'||st.visibility==='hidden')return false;
      const r2=el.getBoundingClientRect();
      if(r2.width<=0&&r2.height<=0)return false;
      return r2.right>vw+1||r2.left<-1;
    });
    const skinOk=X.getAttribute('data-skin')===id;
    const v7attr=X.getAttribute('data-skin-v7');
    const v6attr=X.getAttribute('data-skin-v6');
    const themeOk=(X.getAttribute('data-theme')||'')===theme;
    let stageOk=false, familyOk=false;
    if(V7.indexOf(id)>=0){
      familyOk=v7attr==='1'&&a&&!!a.eng&&(!a.expect||a.eng===a.expect.eng);
      stageOk=!!(a&&a.stage&&a.stage.mounted&&a.stage.h>0&&a.stage.children<=48);
    }else if(V6.indexOf(id)>=0){
      familyOk=!v7attr&&v6attr==='1';
      stageOk=true;
    }else{
      familyOk=!v7attr&&!v6attr;
      stageOk=!!(a&&a.stage&&!a.stage.mounted);
    }
    /* v6.0 新增断言：全池 175 身份都必须有页头徽记 + tabbar 指示形状（≥4px）
       v6.0 修复（验证3）：app 视图 innerHTML 换装窗口期会瞬时查不到 page-title/tabbar.on
       ——单次探测会把时序 flake 误判为缺陷，这里给一次 420ms 宽限重测。 */
    let badge=getBadge(W2);
    let tabW=getTabIndicator(W2);
    let badgeOk=badge!=='(none)'&&badge!=='(no-title)'&&badge.length>=3;
    let tabOk=tabW>=4;
    if(!badgeOk||!tabOk){
      await new Promise(z=>setTimeout(z,420));
      badge=getBadge(W2); tabW=getTabIndicator(W2);
      badgeOk=badge!=='(none)'&&badge!=='(no-title)'&&badge.length>=3;
      tabOk=tabW>=4;
    }
    const errOk=errs.length===0;
    const fontBad=scanMinFont(W2);
    const tapBad=scanTap44(W2);
    const cBad=contrastSpot(W2);
    const rec={id,theme,skin:X.getAttribute('data-skin'),eng:a&&a.eng,badge,tabW:Math.round(tabW),
               stageH:a&&a.stage.h,dom:a&&a.stage.children,overflow:overflowX,errs:errs.slice(0,2),
               font:fontBad.slice(0,2),tap:tapBad.slice(0,2),contrast:cBad.slice(0,2)};
    if(skinOk&&stageOk&&familyOk&&!overflowX&&errOk&&badgeOk&&tabOk&&themeOk&&!fontBad.length&&!tapBad.length&&!cBad.length)pass.push(id);
    else{fail.push(rec);out('FAIL',JSON.stringify(rec));}
  }
  out('== 批量完成('+theme+') ==','通过',pass.length,'失败',fail.length);
  if(fail.length)out('失败清单:',JSON.stringify(fail));
  window.__batchResult={theme,pass,fail};
}
/* ---------- v6.1 并入的增强扫描（来自 v5.6 验证轮：微字号/44px 命中/对比度三对） ---------- */
function hex2rgb(h){h=(h||'').trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function lum2(rgb){const f=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return .2126*f(rgb[0])+.7152*f(rgb[1])+.0722*f(rgb[2]);}
function contrastRatio(fg,bg){const a=lum2(fg),b=lum2(bg),hi=Math.max(a,b),lo=Math.min(a,b);return (hi+.05)/(lo+.05);}
function tokenColor(W2,name){const v=W2.getComputedStyle(W2.document.documentElement).getPropertyValue(name).trim();const m=v.match(/#[0-9a-fA-F]{3,6}/);return m?m[0]:null;}
function contrastSpot(W2){
  const pairs=[['--ink','--paper',4.5],['--ink-2','--surface',4.5],['--ink-3','--paper',4.5]];
  const bad=[];
  for(const [f,b,min] of pairs){
    const fg=hex2rgb(tokenColor(W2,f)),bg=hex2rgb(tokenColor(W2,b));
    if(!fg||!bg)continue;
    const c=contrastRatio(fg,bg);
    if(c<min)bad.push(f+'/'+b+'='+c.toFixed(2));
  }
  return bad;
}
function scanMinFont(W2){
  const bad=[];
  for(const el of W2.document.querySelectorAll('body *')){
    const st=W2.getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden'||parseFloat(st.opacity)<.05)continue;
    const hasText=[...(el.childNodes||[])].some(n=>n.nodeType===3&&n.textContent.trim());
    if(!hasText)continue;
    const r2=el.getBoundingClientRect();
    if(r2.width<=0||r2.bottom<0||r2.top>W2.innerHeight)continue;
    const fs=parseFloat(st.fontSize);
    if(fs<10){bad.push((el.className||el.tagName)+'@'+fs+'px');if(bad.length>=3)break;}
  }
  return bad;
}
function scanTap44(W2){
  const bad=[];
  for(const el of W2.document.querySelectorAll('#skinStage button, #skinStage .gu, #skinStage .vs-it, .tabbar button')){
    const st=W2.getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden'||st.pointerEvents==='none')continue;
    const r2=el.getBoundingClientRect();
    if(r2.width<=0||r2.height<=0)continue;
    if(Math.min(r2.width,r2.height)<44){bad.push((el.className||el.tagName)+'@'+Math.round(Math.min(r2.width,r2.height)));if(bad.length>=3)break;}
  }
  return bad;
}
async function batchPool(theme){
  const themes=theme?[{k:theme}]:[{k:'light'},{k:'dark'}];
  const total={pass:[],fail:[]};
  for(const t of themes){
    out('[batch] === '+t.k.toUpperCase()+' 主题：'+ALL.length+' 身份 ===');
    await batchList(ALL,t.k);
    if(window.__batchResult){total.pass=total.pass.concat(window.__batchResult.pass);total.fail=total.fail.concat(window.__batchResult.fail);}
  }
  window.__batchResult={themes:themes.map(t=>t.k),pass:total.pass,fail:total.fail};
  out('== 全池双主题汇总 ==','通过',total.pass.length,'/',ALL.length*themes.length,'失败',total.fail.length);
}
window.batchPool=batchPool;
window.batchNew=()=>{out('[batch] 新 50 双主题…');batchList(V7.filter(i=>parseInt(i.slice(1))>=86),'light').then(()=>batchList(V7.filter(i=>parseInt(i.slice(1))>=86),'dark'));};
frame.addEventListener('load',()=>{
  const W2=W();
  if(!W2.__v7Hooked){
    W2.__v7Errors=W2.__v7Errors||[];
    W2.addEventListener('error',e=>{W2.__v7Errors.push(String(e.message||e));});
    W2.addEventListener('unhandledrejection',e=>{W2.__v7Errors.push('rej:'+String(e.reason||e));});
    W2.__v7Hooked=true;
  }
  mark(new URLSearchParams(frame.src.split('?')[1]||'').get('skin')||'');
});
/* ---------- 逻辑探针（v6.1 移植自 v5.6 验证轮，适配 150 池） ---------- */
async function waitApp(ms, want){
  const t0=Date.now();
  while(Date.now()-t0<ms){
    try{
      const W2=W(),X=W2.document.documentElement;
      const sk=X&&X.getAttribute('data-skin');
      const chip=W2&&W2.document.querySelector('[data-act="open-skins"]');
      if(want){ if(sk===want&&chip)return true; }
      else if(sk&&chip)return true;
    }catch(e){}
    await new Promise(z=>setTimeout(z,120));
  }
  return false;
}
async function openSkinsEntry(){
  let chip=W().document.querySelector('[data-act="open-skins"]');
  if(chip)return chip;
  const tbs=[...W().document.querySelectorAll('.tabbar button')];
  for(const key of ['账本','设置']){
    const b=tbs.find(x=>x.textContent.indexOf(key)>=0);
    if(!b)continue;
    b.click(); await new Promise(z=>setTimeout(z,420));
    chip=W().document.querySelector('[data-act="open-skins"]');
    if(chip)return chip;
  }
  return null;
}
window.runLogic=async function(){
  const R=[];
  const ok=(name,cond,detail)=>{R.push([name,cond,detail||'']);out(cond?'PASS':'FAIL',name,detail||'');};
  try{
    for(const f of ['app.js','skins-v7.js','skins-v6.js','skins-gen.js','skin-fx.js']){
      const src=await (await fetch('../assets/'+f,{cache:'no-store'})).text();
      try{ new Function(src); ok('P0 编译 '+f,true); }
      catch(e){ ok('P0 编译 '+f,false,String(e.message)); }
    }
  }catch(e){ ok('P0 编译批',false,String(e)); }
  try{
    const m=await (await fetch('../assets/skins/index.json',{cache:'no-store'})).json();
    const ids=m.items.map(x=>x.id);
    ok('P1a 清单=150 且唯一',ids.length===150&&new Set(ids).size===150,ids.length+'/'+new Set(ids).size);
    const v7=ids.filter(i=>/^g(3[6-9]|[4-8][0-9]|9[0-9]|1[0-2][0-9]|13[0-5])$/.test(i));
    ok('P1b v7=100 零图片',v7.length===100&&m.items.filter(x=>v7.indexOf(x.id)>=0).every(x=>!x.art&&!x.thumb),String(v7.length));
  }catch(e){ ok('P1 清单完整性',false,String(e)); }
  await new Promise(res=>{const d=db();d.skins=Object.assign({},d.skins,{active:'zzz',unlocked:ALL.slice()});saveDb(d);frame.onload=res;frame.src='../index.html?t='+Date.now();});
  await waitApp(6000,'paper');
  ok('P2 未知皮肤回退 paper',W().document.documentElement.getAttribute('data-skin')==='paper',W().document.documentElement.getAttribute('data-skin'));
  await new Promise(res=>{const d=db();d.settings=Object.assign({},d.settings,{mode:'ledger'});d.skins=Object.assign({},d.skins,{active:'g36'});saveDb(d);frame.onload=res;frame.src='../index.html?t='+Date.now();});
  await waitApp(6000,'paper');
  const X3=W().document.documentElement;
  ok('P3 纯账本=paper 且无 v7 属性',X3.getAttribute('data-skin')==='paper'&&!X3.getAttribute('data-skin-v7'),
     X3.getAttribute('data-skin')+'/'+(X3.getAttribute('data-skin-v7')||'-'));
  await new Promise(res=>{const d=db();d.settings=Object.assign({},d.settings,{mode:'full'});d.skins=Object.assign({},d.skins,{active:'paper',unlocked:ALL.slice()});saveDb(d);frame.onload=res;frame.src='../index.html?t='+Date.now();});
  await waitApp(6000);
  try{
    const chip=await openSkinsEntry();
    if(!chip)throw new Error('open-skins 入口未找到');
    const cssBefore=(W().document.getElementById('skinsGenCss')||{href:''}).href||'(none)';
    chip.click(); await new Promise(z=>setTimeout(z,500));
    const card=W().document.querySelector('.skin-card[data-act="skin-apply"][data-id="g01"]');
    if(!card)throw new Error('skin-apply g01 卡片未找到');
    card.click(); await new Promise(z=>setTimeout(z,700));
    const cssAfter=((W().document.getElementById('skinsGenCss')||{href:''}).href)||'(none)';
    ok('P4a 实时切 g01 → 注入 gen.css',/skins-gen\.css/.test(cssAfter)&&!/skins-gen\.css/.test(cssBefore),cssBefore+' → '+cssAfter.split('/').pop());
    const chip2=await openSkinsEntry();
    chip2&&chip2.click(); await new Promise(z=>setTimeout(z,500));
    const card2=W().document.querySelector('.skin-card[data-act="skin-apply"][data-id="g36"]');
    if(!card2)throw new Error('skin-apply g36 卡片未找到');
    card2.click(); await new Promise(z=>setTimeout(z,800));
    const css5=((W().document.getElementById('skinsGenCss')||{href:''}).href)||'';
    ok('P4b 实时切 g36 → 换 v7.css',/skins-v7\.css/.test(css5),css5.split('/').pop());
    ok('P4c ensureSkinFamilyCss 行为存在',typeof css5==='string',ensureTag());
    function ensureTag(){const l=W().document.getElementById('skinsGenCss');return l?('id=skinsGenCss href='+l.getAttribute('href').split('/').pop()):'(removed—静态层覆盖)';}
  }catch(e){ ok('P4 实时换肤探针',false,String(e)); }
  try{
    const keys=await caches.keys();
    ok('P5 SW 缓存键存在',keys.some(k=>/^energy-ledger-v/.test(k)),keys.join(','));
  }catch(e){ ok('P5 SW',true,'skip:'+String(e).slice(0,40)); }
  try{
    const m=await (await fetch('../assets/skins/index.json',{cache:'no-store'})).json();
    ok('P6 图鉴 = 25 普通 + 150 顶级 = 175 卡',m.items.length===150,'top='+m.items.length);
  }catch(e){ ok('P6 图鉴总数',false,String(e)); }
  await new Promise(res=>{const d=db();d.settings=Object.assign({},d.settings,{mode:'full'});d.skins=Object.assign({},d.skins,{active:'paper',unlocked:ALL.slice()});saveDb(d);frame.onload=res;frame.src='../index.html?t='+Date.now();});
  await waitApp(6000);
  const fails=R.filter(x=>!x[1]).length;
  out('== 逻辑探针完成 ==','通过',R.length-fails,'失败',fails);
  window.__logicResult=R;
  return R;
};

</script>
